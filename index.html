function cropPhoto(file){return new Promise(r=>{const i=new Image;i.onload=()=>{const W=360,H=480,c=document.createElement("canvas");c.width=W;c.height=H;const k=Math.max(W/i.width,H/i.height),w=i.width*k,h=i.height*k;c.getContext("2d").drawImage(i,(W-w)/2,(H-h)/2,w,h);r(c.toDataURL("image/jpeg",.8))};i.src=URL.createObjectURL(file)})}
function compress(file){return new Promise(r=>{const i=new Image,u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,800/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.6))};i.src=u})}

function docHTML(title,body){return `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>${title}</title><style>body{font-family:Arial,sans-serif;max-width:640px;margin:30px auto;padding:20px;border:3px double #0f6b4f;line-height:1.6}.big{font-size:24px;font-weight:bold;color:#0f6b4f}</style></head><body>${body}<p style="font-size:12px;color:#666">Astuce : ouvrez ce fichier puis Imprimer &gt; Enregistrer en PDF.</p></body></html>`}
async function dl(name,data){
  /* Téléchargement standard (GitHub Pages, Vercel, etc.) via Blob + lien <a download> */
  try{
    const type=name.endsWith(".pdf")?"application/pdf":name.endsWith(".csv")?"text/csv;charset=utf-8":name.endsWith(".vcf")?"text/vcard;charset=utf-8":"application/octet-stream";
    const blob=new Blob([data],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=name;a.style.display="none";
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},1500);
  }catch(e){alert("Le téléchargement a échoué. Réessayez avec Chrome ou Safari, ou faites une capture d'écran.")}
}

async function createAdmin(){const name=$("#an").value.trim(),login=$("#al").value.trim().toLowerCase();if(!name||!login)return alert("Nom et identifiant requis.");
 try{const r=await api("adminSave",{name,login,perms:picked("adp")},"a");secretBox("Compte créé : "+name,`Identifiant : <b>${esc(r.login)}</b><br>Mot de passe provisoire :`,r.pwd,"",`Bonjour ${name}, votre accès administrateur : identifiant ${r.login} / mot de passe provisoire ${r.pwd}. Vous devrez le changer à la première connexion.`);adminAdmins()}catch(e){alert(e.message)}}
async function saveAdmin(id){const a=ADMS.find(x=>x.id==id);try{await api("adminSave",{id,name:a.name,perms:picked("ad_"+id),active:a.active},"a");alert("Droits enregistrés.");adminAdmins()}catch(e){alert(e.message)}}
async function toggleAdmin(id){const a=ADMS.find(x=>x.id==id);try{await api("adminSave",{id,name:a.name,perms:a.perms,active:!a.active},"a");adminAdmins()}catch(e){alert(e.message)}}
async function resetAdmin(id){const a=ADMS.find(x=>x.id==id);if(!await dlgConfirm("Générer un nouveau mot de passe provisoire pour « "+a.name+" » ?"))return;try{const r=await api("adminReset",{id},"a");secretBox("Nouveau mot de passe : "+a.name,`Identifiant : <b>${esc(a.login)}</b><br>Mot de passe provisoire :`,r.pwd,"",`Bonjour ${a.name}, votre nouveau mot de passe provisoire : ${r.pwd} (identifiant ${a.login}).`);adminAdmins()}catch(e){alert(e.message)}}
async function delAdmin(id){const a=ADMS.find(x=>x.id==id);if(!await dlgConfirm("Supprimer définitivement le compte de « "+a.name+" » ?"))return;try{await api("adminDel",{id},"a");adminAdmins()}catch(e){alert(e.message)}}
