<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1b1f2a;--m:#667;--p:#0b6fcf;--b:#dde1ea;--w:#b45309;--e:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--c:#1c212b;--t:#eef0f5;--m:#9aa3b5;--p:#3b8fe8;--b:#2c3342}}
:root[data-theme="dark"]{--bg:#12151c;--c:#1c212b;--t:#eef0f5;--m:#9aa3b5;--p:#3b8fe8;--b:#2c3342}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
header{background:linear-gradient(90deg,#0a2a6b,#0b6fcf);color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header b{font-size:18px}nav a{color:#fff;margin-left:12px;font-size:14px;text-decoration:none;opacity:.9}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:14px}
h1,h2,h3{margin:.2em 0 .5em}label{display:block;font-size:14px;margin:10px 0 4px;color:var(--m)}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t);width:100%}
button{background:var(--p);color:#fff;border:0;cursor:pointer;font-weight:600;width:auto;padding:10px 16px}
button.s{background:transparent;color:var(--p);border:1px solid var(--p)}button.r{background:var(--e)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.cd{display:flex;gap:10px}.cd div{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:8px 12px;text-align:center;min-width:64px}.cd b{font-size:24px;display:block}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--b);padding:8px;text-align:left;white-space:nowrap}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:#e5e7eb;color:#333}.tag.v{background:#d1fae5;color:#065f46}.tag.a{background:#fef3c7;color:#92400e}.tag.x{background:#fee2e2;color:#991b1b}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k div{background:var(--bg);border-radius:10px;padding:10px}.k b{font-size:20px;display:block}
.note{background:#fef3c7;color:#92400e;border-radius:8px;padding:10px;font-size:14px}
.big{font-size:26px;font-weight:800;letter-spacing:1px;color:var(--p)}
img.th{height:44px;border-radius:6px;cursor:pointer}
@media print{header,.np{display:none}body{background:#fff}}

 ${S.dreq.length?`<h3>Demandes d'autorisation</h3><div class="tw"><table><tr><th>N°</th><th>Étudiant</th><th>Partenaire</th><th>Demandé le</th><th>État</th><th>Action</th></tr>${S.dreq.map(r=>{const pp=S.partners.find(x=>x.id==r.partner);return `<tr><td>${esc(r.num)}</td><td>${esc(r.nom)}</td><td>${pp?esc(pp.name):"-"}</td><td>${new Date(r.date).toLocaleDateString("fr-FR")}</td><td>${r.st=="ok"?'<span class="tag v">Autorisée</span>':r.st=="non"?'<span class="tag x">Refusée</span>':r.st=="annule"?'<span class="tag">Annulée (contrat rompu)</span>':'<span class="tag a">En attente du partenaire</span>'}</td><td>${r.st=="ok"?`<button class="r" onclick="delStudent('${r.num}')">Supprimer maintenant</button>`:`<button class="s" onclick="closeReq('${r.id}')">${r.st=="attente"?"Annuler la demande":"Fermer"}</button>`}</td></tr>`}).join("")}</table></div>`:""}
 ${S.log.length?`<details style="margin-top:10px"><summary><b>Historique des suppressions (${S.log.length})</b></summary><div class="tw"><table><tr><th>Date</th><th>N°</th><th>Étudiant</th><th>Statut</th><th>Partenaire</th><th>Autorisation</th></tr>${S.log.slice(0,50).map(g=>`<tr><td>${new Date(g.date).toLocaleString("fr-FR")}</td><td>${esc(g.num)}</td><td>${esc(g.nom)}</td><td>${esc(g.statut)}</td><td>${esc(g.partner)}</td><td>${esc(g.how)}</td></tr>`).join("")}</table></div></details>`:""}</div>
 <div class="card"><h2>Inscriptions</h2><input placeholder="🔎 Rechercher (nom, numéro, identifiant, e-mail)" oninput="filt(this.value)"><div class="tw"><table><tr><th>N°</th><th>Identifiant</th><th>Étudiant</th><th>Partenaire</th><th>Montant / Réf.</th><th>Preuve</th><th>Statut</th><th>Terminé</th><th>Action</th></tr>
 ${S.students.slice().reverse().map(s=>{const p=S.partners.find(x=>x.id==s.partner),msg=encodeURIComponent(s.status=="valide"?`Bonjour ${s.prenoms}, votre paiement est validé. Forum : ${CFG.forum}`:`Bonjour ${s.prenoms}, votre paiement a été rejeté : ${s.motif||""}`);return `<tr class="ln"><td>${s.num}</td><td><b>${s.id}</b></td><td><button class="s" style="padding:2px 8px;font-size:12px" onclick="zoomImg('${s.num}','photo')">📷 Photo</button><br>${esc(s.nom)} ${esc(s.prenoms)} ${dup(s)?'<span class="tag x">⚠ doublon</span>':""}<br><small>${esc(s.email)}</small></td><td>${p?esc(p.name):"Direct"}</td><td>${fmt(s.montant)}<br><small>${esc(s.trx||"")}</small></td><td><button class="s" style="padding:2px 8px;font-size:12px" onclick="zoomImg('${s.num}','shot')">🧾 Voir</button></td><td>${tag(s.status)}${s.motif?`<br><small>${esc(s.motif)}</small>`:""}</td><td><input type="checkbox" style="width:auto" ${s.termine?"checked":""} onchange="setTerm('${s.num}',this.checked)"></td><td>${s.status=="attente"?`<input id="mo_${s.num}" placeholder="Motif si rejet" style="width:140px"><br><button onclick="setSt('${s.num}','valide')">Valider</button> <button class="r" onclick="setSt('${s.num}','rejete')">Rejeter</button>`:`<a href="mailto:${esc(s.email)}?subject=MK-DESIGN GRAPH&body=${msg}" target="_blank">✉️ Notifier</a>`}<br><button class="r" style="padding:3px 8px;font-size:12px;margin-top:4px" onclick="delStudent('${s.num}')">🗑 Supprimer</button></td></tr>`}).join("")||"<tr><td colspan=9>Aucune inscription</td></tr>"}</table></div></div>`;
 $("#ap").onclick=()=>{const n=$("#pn").value.trim();if(!n)return;call("addPartner",{name:n,coef:+$("#pc").value||0})}}

// ====== Actions admin (appels serveur) ======
async function call(a,d){try{const r=await api(a,d,"a");await admin();return r}catch(e){alert(e.message)}}
function filt(v){v=v.toLowerCase();document.querySelectorAll("tr.ln").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v)?"":"none")}
const setPaid=(id,v)=>call("setPaid",{id,v:+v}),setTerm=(num,v)=>call("setTerm",{num,v}),allTerm=()=>call("allTerm"),setCoef=(id,v)=>call("setCoef",{id,v:+v}),closeReq=id=>call("closeReq",{id}),
 setSt=(num,st)=>call("setStatus",{num,st,motif:(($("#mo_"+num)||{}).value)||""}),restoreContract=id=>{if(confirm("Rétablir ce contrat ? L'accès et le lien du partenaire seront réactivés."))call("restoreContract",{id})};
async function exportCSV(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const rows=[["Numero","Identifiant","Nom","Prenoms","Naissance","Lieu","Email","Montant","Ref transaction","Partenaire","Statut","Termine","Date"]].concat(S.students.map(s=>{const p=S.partners.find(x=>x.id==s.partner);return [s.num,s.id,s.nom,s.prenoms,s.dob,s.lieu,s.email,s.montant,s.trx,p?p.name:"Direct",s.status,s.termine?"oui":"non",s.date]}));
 dl("inscriptions.csv","\ufeff"+rows.map(r=>r.map(q).join(";")).join("\n"))}
async function zoomImg(num,field){const w=open("");try{const r=await api("img",{num,field},"a");w.document.write(`<img src="${r.data}" style="max-width:100%">`)}catch(e){w.close();alert(e.message)}}
async function delStudent(num){const s=S.students.find(x=>x.num==num);if(!s)return;
 const p=S.partners.find(x=>x.id==s.partner),label=s.num+" – "+s.nom+" "+s.prenoms;let msg;
 if(!S.prod)msg="MODE TEST\n\nSupprimer définitivement l'inscription "+label+" ?";
 else if(!p||p.rompu)msg="Supprimer définitivement l'inscription "+label+" ?"+(p?"\n\n(Le contrat du partenaire est rompu : son autorisation n'est plus requise.)":"");
 else{const r=S.dreq.find(x=>x.num==num);
  if(r&&r.st=="attente")return alert("Demande déjà envoyée à "+p.name+". Vous devez attendre son autorisation.");
  msg=r&&r.st=="ok"?"Autorisation donnée par "+p.name+".\n\nSupprimer définitivement l'inscription "+label+" ?":"PRODUCTION\n\nLa suppression de "+label+" nécessite l'autorisation du partenaire « "+p.name+" ».\n\nEnvoyer la demande ?"}
 if(!confirm(msg))return;
 const r=await call("delStudent",{num});if(!r)return;
 if(r.refused){if(confirm(r.refused+" a refusé la suppression. Envoyer une nouvelle demande ?"))await call("delStudent",{num,retry:true})}
 else if(r.requested)alert("Demande envoyée à "+r.requested+". Elle apparaît dans son espace partenaire.");
 else if(r.pending)alert("Demande déjà envoyée à "+r.pending+".")}
function purgeAll(){if(S.prod)return;if(!S.students.length)return alert("Aucune inscription à supprimer.");
 if(!confirm("Supprimer TOUTES les inscriptions ("+S.students.length+") ? Cette action est irréversible."))return;
 if(prompt("Tapez SUPPRIMER pour confirmer :")!="SUPPRIMER")return;call("purgeAll")}
function toggleProd(){
 if(!S.prod){if(prompt("Passer en MODE PRODUCTION ?\n\nLes suppressions d'inscriptions liées à un partenaire exigeront son autorisation. Vous ne pourrez revenir en mode test que s'il n'y a aucune inscription.\n\nTapez PRODUCTION pour confirmer :")!="PRODUCTION")return;call("setProd",{v:true})}
 else{if(S.students.length)return alert("Impossible : des inscriptions existent déjà.");if(confirm("Repasser en mode test ?"))call("setProd",{v:false})}}
function breakContract(id){const p=S.partners.find(x=>x.id==id);if(!p||p.rompu)return;
 const m=prompt("ROMPRE LE CONTRAT avec « "+p.name+" » ?\n\nSon accès sera fermé et son lien d'inscription désactivé. Les commissions sur les paiements déjà validés restent dues ; aucune nouvelle commission ne sera générée.\n\nSaisissez un motif (facultatif) puis OK pour confirmer, ou Annuler pour abandonner :");
 if(m===null)return;call("breakContract",{id,motif:m.trim()})}
async function resetPin(id){const p=S.partners.find(x=>x.id==id);if(!p||!confirm("Réinitialiser le mot de passe de « "+p.name+" » ? Un nouveau code secret sera généré."))return;
 const r=await call("resetPin",{id});if(r)alert("Nouveau code secret de "+p.name+" : "+r.pin+"\n\nCommuniquez-le au partenaire : il pourra le changer depuis son espace.")}
route();
</script></body></html>
