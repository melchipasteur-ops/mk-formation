<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">

<title>Ma formation — MK-DESIGN GRAPH</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>:root{--bg:#f1f5fb;--c:#fff;--t:#0f172a;--m:#64748b;--p:#0b6fcf;--p2:#7c3aed;--b:#e2e8f0;--w:#d97706;--e:#dc2626;--ok:#16a34a;--code:#0b1220;--codet:#e2e8f0;--sh:0 8px 28px rgba(15,23,42,.08);--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--c:#131c2e;--t:#e8eefc;--m:#94a3b8;--p:#4aa3ff;--p2:#a78bfa;--b:#243049;--sh:0 8px 28px rgba(0,0,0,.35);--ok:#4ade80;--e:#f87171;--w:#fbbf24}}
*{box-sizing:border-box}html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;background:radial-gradient(1100px 480px at 8% -8%,rgba(11,111,207,.13),transparent 60%),radial-gradient(900px 420px at 100% 0,rgba(124,58,237,.11),transparent 60%),var(--bg);background-attachment:fixed}
#app{max-width:900px;margin:0 auto;padding:14px 14px 70px}
h1{font-size:23px;line-height:1.25;margin:4px 0}h2{font-size:19px;margin:2px 0 10px}h3{font-size:15px;margin:18px 0 8px;color:var(--p)}
small,.m{color:var(--m)}a{color:var(--p)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ---- cartes ---- */
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:var(--sh);animation:up .35s ease both}
.card>small:first-child{display:inline-block;background:rgba(11,111,207,.1);color:var(--p);border-radius:99px;padding:2px 12px;font-weight:700;font-size:12px;margin-bottom:6px}
.hero{border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,#0b6fcf 0%,#4f46e5 55%,#7c3aed 100%);box-shadow:0 16px 40px rgba(79,70,229,.35);position:relative;overflow:hidden;animation:up .35s ease both}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero:before{content:"";position:absolute;left:-40px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero>*{position:relative;z-index:1}.hero h1{color:#fff;font-size:24px}.hero p{color:rgba(255,255,255,.88);margin:6px 0}
.hero .logo{height:36px;background:#fff;border-radius:10px;padding:5px 10px;margin-bottom:12px;display:block}
.hero .hrow{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero button,.hero .btn{background:#fff;color:#4f46e5;box-shadow:0 6px 18px rgba(0,0,0,.18)}.hero button.s{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.45);box-shadow:none}
.ring{position:relative;width:92px;height:92px;flex:none}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}.ring small{color:rgba(255,255,255,.85)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0}
/* ---- boutons et champs ---- */
button,.btn{font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));border:0;border-radius:12px;padding:11px 16px;min-height:44px;cursor:pointer;box-shadow:0 6px 16px rgba(79,70,229,.28);transition:transform .15s,box-shadow .15s,opacity .15s}
button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(79,70,229,.34)}button:active{transform:none}
button.s{background:transparent;color:var(--p);border:1.5px solid var(--p);box-shadow:none}button.g{background:linear-gradient(135deg,#16a34a,#0d9488);box-shadow:0 6px 16px rgba(22,163,74,.3)}button.r{background:linear-gradient(135deg,#dc2626,#ea580c);box-shadow:0 6px 16px rgba(220,38,38,.28)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
input,textarea,select{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--b);border-radius:12px;background:var(--bg);color:var(--t);transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(11,111,207,.15)}
textarea{min-height:96px;resize:vertical}label{display:block;font-weight:700;margin:12px 0 5px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
/* ---- progression ---- */
.bar{height:11px;background:var(--b);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#16a34a,#22d3ee);transition:width .6s ease}
/* ---- grille des jours ---- */
.wk{display:flex;align-items:center;gap:10px;margin:22px 0 8px;font-weight:800}.wk i{width:12px;height:12px;border-radius:50%;background:var(--wk)}.wk small{font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.day{text-align:left;color:var(--t);background:var(--c);border:1px solid var(--b);border-left:6px solid var(--wk,#2563eb);border-radius:14px;padding:12px;min-height:112px;display:block;box-shadow:var(--sh);transition:transform .2s}
.day:hover{transform:translateY(-3px)}.day b{display:block;font-size:12px;color:var(--wk);letter-spacing:.4px;text-transform:uppercase}.day span{display:block;font-size:14px;line-height:1.35;margin:3px 0 7px;font-weight:600}
.day.lock{filter:grayscale(.55);opacity:.72;box-shadow:none}.day.ok{background:linear-gradient(180deg,rgba(22,163,74,.08),var(--c))}.day.bad{background:linear-gradient(180deg,rgba(220,38,38,.07),var(--c))}.day.pend{background:linear-gradient(180deg,rgba(217,119,6,.09),var(--c))}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--b);color:var(--t)}
.tag.ok{background:var(--ok);color:#fff}.tag.bad{background:var(--e);color:#fff}.tag.pend{background:var(--w);color:#fff}.tag.open{background:rgba(11,111,207,.15);color:var(--p)}
/* ---- onglets ---- */
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px;margin:10px 0;background:var(--c);border:1px solid var(--b);border-radius:16px;box-shadow:var(--sh);overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;background:transparent;color:var(--m);box-shadow:none;min-height:40px}.tabs button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 14px rgba(79,70,229,.3)}
/* ---- encadrés ---- */
.note{border-left:5px solid var(--p);background:rgba(11,111,207,.07);padding:12px 14px;border-radius:12px;margin:12px 0}
.note.warn{border-color:var(--w);background:rgba(217,119,6,.10)}.note.bad{border-color:var(--e);background:rgba(220,38,38,.09)}.note.good{border-color:var(--ok);background:rgba(22,163,74,.10)}.note.prof{border-color:var(--p2);background:rgba(124,58,237,.09)}
.tool{border:1px solid var(--b);border-radius:14px;padding:12px;margin:10px 0;background:var(--bg)}
/* ---- code et étapes ---- */
pre{background:var(--code);color:var(--codet);padding:14px;border-radius:14px;overflow:auto;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre;margin:8px 0;border:1px solid rgba(255,255,255,.07)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(124,58,237,.12);padding:1px 6px;border-radius:6px;font-size:.92em}pre code{background:none;padding:0}
.pm{display:flex;gap:8px;align-items:flex-start;background:rgba(11,111,207,.06);border:1.5px dashed var(--p);border-radius:12px;padding:10px;margin:8px 0}.pm code{flex:1;background:none;font-size:13px;white-space:pre-wrap;word-break:break-word}.pm button{padding:6px 10px;min-height:36px;font-size:13px}
ol{counter-reset:s;list-style:none;padding:0;margin:10px 0}ol>li{counter-increment:s;position:relative;padding:11px 12px 11px 50px;margin:8px 0;background:var(--bg);border-radius:12px}
ol>li:before{content:counter(s);position:absolute;left:12px;top:10px;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:800;text-align:center;line-height:28px;font-size:13px}
ul{padding-left:22px}li{margin:3px 0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;border-bottom:1px solid var(--b);cursor:pointer;border-radius:10px}.chk:hover{background:var(--bg)}.chk input{width:24px;height:24px;margin-top:2px;flex:none;accent-color:#16a34a}
.chk.done>div{text-decoration:line-through;color:var(--m)}.chk.done .pm{text-decoration:none}
.fig{margin:12px 0;text-align:center;background:var(--bg);border-radius:14px;padding:10px}
iframe{width:100%;height:330px;border:1px solid var(--b);border-radius:14px;background:#fff}.lv{display:none;margin-top:10px}.lv.on{display:block}.lv.mob{max-width:360px;margin-left:auto;margin-right:auto}
.ed{font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;min-height:230px;white-space:pre;tab-size:2}
/* ---- questions ---- */
.op{display:block;width:100%;text-align:left;background:var(--bg);color:var(--t);border:1.5px solid var(--b);margin:7px 0;box-shadow:none;font-weight:500}.op:hover{border-color:var(--p);box-shadow:none}.op.sel{border-color:var(--p);background:rgba(11,111,207,.13);font-weight:700}
.qq{margin:16px 0;padding-bottom:12px;border-bottom:1px solid var(--b)}.qy{color:var(--ok);margin-top:6px;font-weight:600}.qn{color:var(--e);margin-top:6px;font-weight:600}
/* ---- schémas de page ---- */
.wf{border:1px solid var(--b);border-radius:12px;padding:6px;background:var(--bg);margin:8px 0}.z{border:2px dashed var(--p);border-radius:8px;padding:6px 8px;margin:4px;font:12px ui-monospace,Menlo,monospace;background:rgba(11,111,207,.08)}.wfm{display:flex}.zs{border-color:var(--ok);background:rgba(22,163,74,.1)}.zh,.zf{border-color:var(--w);background:rgba(217,119,6,.1)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 7px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}th{color:var(--m);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.tw{overflow:auto}details summary{cursor:pointer;padding:6px 0;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.adm{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border-radius:14px;padding:10px 14px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.adm button{background:#fff;color:#4f46e5;min-height:36px;padding:6px 12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}.kc{border-radius:16px;padding:14px;color:#fff;box-shadow:var(--sh)}.kc b{display:block;font-size:26px;line-height:1.1}.kc small{color:rgba(255,255,255,.88)}
.k1{background:linear-gradient(135deg,#0b6fcf,#4f46e5)}.k2{background:linear-gradient(135deg,#ea580c,#d97706)}.k3{background:linear-gradient(135deg,#16a34a,#0d9488)}.k4{background:linear-gradient(135deg,#7c3aed,#db2777)}
/* ---- bulletin et fiche (papier) ---- */
.bul{background:#fff;color:#0a2a6b;border:1px solid #cbd5e1;border-radius:14px;padding:22px;margin:14px 0;box-shadow:var(--sh);color-scheme:light}
.bul .bh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid #0b6fcf;padding-bottom:12px;margin-bottom:14px}.bul img{max-width:100%;height:46px}
.bul h1{color:#0a2a6b;font-size:21px;letter-spacing:1px;margin:0}.bul table{color:#0f172a}.bul th{color:#0a2a6b;background:#eef5ff}.bul td,.bul th{padding:7px 6px;border-bottom:1px solid #e2e8f0}.bul tr:nth-child(even) td{background:#f8fafc}
.bul .sum{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}.bul .sum div{flex:1;min-width:120px;background:#eef5ff;border-radius:12px;padding:10px;text-align:center}.bul .sum b{display:block;font-size:22px;color:#0b6fcf}
.bul a{color:#0b6fcf}
@media print{body{background:#fff!important}#app>*:not(.bul){display:none!important}.bul{box-shadow:none;border:0;margin:0}.np{display:none!important}}
a.btn{display:inline-block;text-decoration:none}
</style></head><body><div id="app"></div>
<script>

["\u003clink>","Relie un fichier externe, surtout le CSS","\u003clink rel=\"stylesheet\" href=\"style.css\">"],
["\u003cstyle>","Contient du CSS écrit dans la page","\u003cstyle>p{color:red}\u003c/style>"],

/* ============ LEÇONS DÉTAILLÉES + QUESTIONS (jours 15 à 20 : le site web, étape par étape) ============ */

const $=s=>document.querySelector(s),app=$("#app"),CP=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=t=>t?new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function cp(i){const t=CP[i];const done=()=>toast("Copié ✔");
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,()=>fb());else fb();
 function fb(){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast("Copie impossible")}a.remove()}}
const cpBtn=t=>`<button class="s" onclick="cp(${CP.push(t)-1})">📋 Copier</button>`;
/* texte avec prompts « … » transformés en blocs copiables */
function rich(t){const ps=[];const h=esc(t.replace(/«\s*([^»]{20,}?)\s*»/g,(m,p)=>{ps.push(p);return m}));
 return h+ps.map(p=>`<div class="pm"><code>${esc(p)}</code>${cpBtn(p)}</div>`).join("")}


const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
const cdx=t=>`<code>${esc(t)}</code>`;
function partsIn(){return `<h2>🧩 Les parties d'un site web</h2>${PARTS.map(([a,b])=>`<div class="tool"><b>${esc(a)}</b><p>${esc(b)}</p></div>`).join("")}
 <h3>Les parties d'une page (de haut en bas)</h3><div class="wf"><div class="z zh">&lt;header&gt; En-tête</div><div class="z">&lt;nav&gt; Menu</div><div class="wfm"><div class="z" style="flex:3">&lt;main&gt; Contenu principal<div class="z zs">&lt;section&gt;</div><div class="z zs">&lt;article&gt;</div></div><div class="z" style="flex:1">&lt;aside&gt;</div></div><div class="z zf">&lt;footer&gt; Pied de page</div></div>
 <div class="tw" style="overflow:auto"><table><tr><th>Partie</th><th>Balise</th><th>Rôle</th></tr>${ZONES.map(z=>`<tr><td><b>${esc(z[0])}</b></td><td>${cdx(z[1])}</td><td>${esc(z[2])}</td></tr>`).join("")}</table></div>
 <h3>Les 4 parties d'un fichier HTML</h3><div style="overflow:auto"><table>${DOCP.map(z=>`<tr><td>${cdx(z[0])}</td><td>${esc(z[1])}</td></tr>`).join("")}</table></div>`}
function tagsIn(){return `<h2>🏷 Les balises HTML : nom et rôle</h2><p class="m">Une balise s'écrit entre chevrons. La plupart s'ouvrent ${cdx("<p>")} et se ferment ${cdx("</p>")}. Quelques-unes n'ont pas de fermeture : br, img, input, meta, link, hr.</p>
 ${TAGS.map(([g,rows])=>`<h3>${esc(g)}</h3><div style="overflow:auto"><table><tr><th>Balise</th><th>Nom et rôle</th><th>Exemple</th></tr>${rows.map(r=>`<tr><td>${cdx(r[0])}</td><td>${esc(r[1])}</td><td>${cdx(r[2])} <button class="s" style="padding:2px 8px;min-height:28px" onclick="cp(${CP.push(r[2])-1})">📋</button></td></tr>`).join("")}</table></div>`).join("")}`}
const refDetails=()=>`<details class="card"><summary><b>📚 Aide-mémoire : parties d'un site et balises HTML</b></summary>${partsIn()}${tagsIn()}</details>`;
const wrap=c=>/<html|<!doctype/i.test(c)?c:`<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>${c}</body></html>`;
/* assemble le site : intègre style.css et script.js dans index.html pour l'aperçu */
function site(F){const ks=Object.keys(F),g=f=>F[f.replace(/^\.\//,"")];let m=F["index.html"]??F[ks.find(k=>/\.html?$/i.test(k))]??"";
 m=m.replace(/<link[^>]*href=["']([^"']+\.css)["'][^>]*>/gi,(x,f)=>g(f)!=null?`<style>${g(f)}</style>`:x).replace(/<script[^>]*src=["']([^"']+\.js)["'][^>]*>\s*<\/script>/gi,(x,f)=>g(f)!=null?`<script>${g(f).replace(/<\/script/gi,"<\\/script")}<\/script>`:x);return wrap(m)}

 else h+=`<div class="note">📅 Jour ouvert aujourd'hui : <b>${s.openDay}</b> sur 30. Les jours suivants s'ouvrent sur l'ordre de MK-DESIGN GRAPH.</div>`;

 if(s.pend)h+=`<div class="note">💳 Paiement de <b>${fmt(s.pend)}</b> en attente de validation par MK-DESIGN GRAPH.</div>`;return h}

const LB={ok:"✅ Validé",bad:"🔁 À refaire",pend:"⏳ En correction",open:"▶ À faire"},LK={start:"🕒 Bientôt",wait:"🕒 Pas encore ouvert",pay:"💳 Paiement requis",prev:"🔒 Jour précédent"};

 <details class="card"><summary>📜 Règles de la formation</summary><ul><li>Un jour s'ouvre sur l'ordre de MK-DESIGN GRAPH (un par jour, parfois plus tôt si le cours du jour est terminé).</li><li>Pour passer au jour suivant, il faut obtenir au moins <b>${PM}/20</b> : 70 % pour votre exercice pratique (noté par le correcteur) et 30 % pour les questions théoriques (corrigées automatiquement).</li><li>Vous pouvez remettre à nouveau un travail noté en dessous de ${PM}/20.</li><li>Les 2 premiers jours sont gratuits ; ensuite 7 000 F (jours 1 à 10) puis 5 000 F, ou 12 000 F en une fois.</li><li>L'attestation n'est délivrée qu'après la validation des 30 jours.</li><li>Votre bulletin de notes et la fiche de correction de chaque jour corrigé sont disponibles à tout moment.</li></ul></details>`;

 const rows=B.rows.map(r=>`<tr><td>${r.n}</td><td>${esc(r.title.replace(/^(GRAND )?PROJET[^—]*— /,"Projet : "))}</td><td>${r.gp==null?"-":r.gp}</td><td>${r.gt==null?"-":r.gt}</td><td><b>${r.grade==null?(r.sub?"en correction":"-"):r.grade}</b></td><td>${r.grade==null?"":r.grade>=PM?"Validé":"À refaire"}</td><td class="np">${r.grade!=null?`<a href="#/fiche/${r.n}">Fiche</a>`:""}</td></tr>`).join("");
 app.innerHTML=asBar()+`<div class="top np"><button class="s" onclick="go('#/')">← Retour</button><span><button onclick="pdfBulletin()">⬇ Télécharger en PDF</button> <button class="s" onclick="window.print()">🖨 Imprimer</button></span></div>

function pdfBulletin(){const B=window.BUL;if(!window.jspdf)return toast("Module PDF indisponible : vérifiez votre connexion internet.");
 const d=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),N=[10,42,107],BL=[11,111,207];
 try{d.addImage(LOGO,"JPEG",15,10,100,18.2)}catch(e){}
 d.setDrawColor(...BL);d.setLineWidth(.8);d.line(15,32,195,32);
 d.setFont("helvetica","bold");d.setFontSize(17);d.setTextColor(...N);d.text("BULLETIN DE NOTES",15,43);

 let y=63;d.setFillColor(238,245,255);d.rect(15,y-5,180,7,"F");d.setFont("helvetica","bold");d.setFontSize(8.5);d.setTextColor(...N);
 [["Jour",17],["Activité",28],["Pratique",120],["Théorie",140],["Note /20",158],["Résultat",177]].forEach(([l,x])=>d.text(clean(l),x,y));
 d.setFont("helvetica","normal");d.setFontSize(8.5);d.setTextColor(30,30,30);
 B.rows.forEach((r,i)=>{y+=6.3;if(i%2)  {d.setFillColor(248,250,252);d.rect(15,y-4.4,180,6.3,"F")}
  const t=clean(r.title.replace(/^(GRAND )?PROJET[^—]*— /,"Projet : ")),tt=t.length>62?t.slice(0,60)+"...":t;
  d.text(String(r.n),19,y);d.text(tt,28,y);d.text(r.gp==null?"-":String(r.gp),124,y);d.text(r.gt==null?"-":String(r.gt),144,y);
  d.setFont("helvetica","bold");d.text(r.grade==null?(r.sub?"correction":"-"):String(r.grade),162,y);d.setFont("helvetica","normal");d.text(r.grade==null?"":r.grade>=PM?"Valide":"A refaire",177,y)});
 y+=11;d.setDrawColor(...BL);d.setLineWidth(.4);d.line(15,y-6,195,y-6);d.setFont("helvetica","bold");d.setFontSize(10);d.setTextColor(...N);
 d.text(`Jours validés : ${B.validated}/${B.total}`.replace("é","e"),15,y);d.text("Moyenne : "+(B.avg==null?"-":B.avg+"/20"),90,y);d.text(B.complete?"Mention : "+B.mention.replace("è","e"):"Formation en cours",150,y);
 d.setFont("helvetica","normal");d.setFontSize(7.5);d.setTextColor(110,110,110);d.text("Document généré par MK-DESIGN GRAPH. Note finale = pratique (70 %) + théorie (30 %). Minimum 14/20 par jour.".replace("é","e"),15,288);

 <div class="bul"><div class="bh"><img src="${LOGO}" alt="MK-DESIGN GRAPH"><div style="text-align:right"><h1>FICHE DE CORRECTION</h1><small style="color:#475569">Jour ${F.n}</small></div></div>
 <p><b>Étudiant :</b> ${esc(F.name)} (${esc(F.num)})<br><b>Activité :</b> Jour ${F.n} — ${esc(F.title)}<br><b>Remis le</b> ${fd(F.sub)} · <b>corrigé le</b> ${F.gat?fd(F.gat):"-"} · tentative n°${F.att}</p>
 <div class="sum"><div><b>${F.gp==null?"-":F.gp}</b>pratique /20</div>${F.theory?`<div><b>${F.gt}</b>théorie /20</div>`:""}<div><b>${F.grade}</b>note finale /20</div><div><b>${F.grade>=PM?"Validé":"À refaire"}</b>résultat</div></div>
 <h3>Critères d'évaluation de l'exercice pratique</h3><ul>${F.crit.b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${F.crit.a?`<p><b>Résultat attendu :</b> ${esc(F.crit.a)}</p>`:""}
 <h3>Commentaire du correcteur</h3><p>${F.comment?esc(F.comment):"<i>Pas de commentaire.</i>"}</p>
 ${F.theory?`<h3>Correction des questions théoriques (${F.theory.s}/${F.theory.t})</h3>${F.theory.items.map((i,k)=>`<div class="qq"><b>${k+1}. ${esc(i.q)}</b><br>${i.ok?"✅":"❌"} Votre réponse : <i>${esc(i.a)}</i>${i.ok?"":`<br>Bonne réponse : <b>${esc(i.good)}</b>`}<br><small style="color:#475569">${esc(i.ex)}</small></div>`).join("")}`:""}
 <h3>Votre travail remis</h3>${F.data.answer?`<pre style="white-space:pre-wrap">${esc(F.data.answer)}</pre>`:""}${fl.map(([k,v])=>`<small>📄 ${esc(k)}</small><pre>${esc(v)}</pre>`).join("")}${F.data.shot?`<img src="${F.data.shot}" alt="Capture" style="max-width:100%;border:1px solid #cbd5e1;border-radius:10px">`:""}</div>`}

/* ===== Page d'un jour ===== */
async function dayPage(n,tab){let D;try{D=await sapi("fDay",{day:n})}catch(e){app.innerHTML=`<div class="card"><h2>🔒 Jour ${n}</h2><p>${esc(e.message)}</p><p><button class="s" onclick="go('#/')">← Accueil</button></p></div>`;return}
 const rec=Object.assign({steps:[],ex:[],answer:"",files:null,shot:"",qa:{},sub:0,grade:null},D.rec);CUR={n,D,rec};QR=null;
 const st=rec.sub?(rec.grade==null?"pend":rec.grade>=PM?"ok":"bad"):"open";
 app.innerHTML=asBar()+`<div class="top"><button class="s" onclick="go('#/')">← Accueil</button><span class="tag ${st}">${LB[st]}</span></div><div class="hero" style="padding:16px"><small style="color:rgba(255,255,255,.85)">${esc(D.day.meta)}</small><h1>Jour ${n} — ${esc(D.day.title)}</h1></div>
 <div class="tabs"><button class="${tab=="cours"?"on":""}" onclick="go('#/j/${n}')">📖 Cours</button><button class="${tab=="app"?"on":""}" onclick="go('#/j/${n}/app')">🛠 Application</button></div><div id="body"></div>`;
 tab=="cours"?coursTab():appTab()}
const sec=(d,re)=>d.s.filter(x=>re.test(x.h));
function blocks(b){return b.map(x=>x.k=="p"?`<p>${esc(x.t)}</p>`:x.k=="ul"?`<ul>${x.i.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:x.k=="ol"?`<ol>${x.i.map(i=>`<li>${esc(i)}</li>`).join("")}</ol>`:x.k=="tool"?`<div class="tool"><b>${esc(x.name)}</b> <small>${esc(x.plat)}</small><p>${esc(x.d)}</p></div>`:`<pre>${esc(x.t)}</pre>${cpBtn(x.t)}`).join("")}
function lessonPv(i){const p=CUR.D.lesson.parts[i];return p.pv?site({"index.html":CUR.D.sites[p.pv],"style.css":p.cum||""}):site({"index.html":p.code})}
function runLesson(i,b){const f=document.getElementById("lv"+i);if(f.classList.toggle("on")){f.srcdoc=lessonPv(i);b.textContent="✖ Masquer le résultat"}else b.textContent=b.dataset.t}
function lessonHTML(){const L=CUR.D.lesson;if(!L)return"";return L.parts.map((p,i)=>`<div class="card"><small>Partie ${i+1} sur ${L.parts.length}</small><h2>${esc(p.t)}</h2>${(p.p||[]).map(x=>`<p>${md(x)}</p>`).join("")}${p.img&&IMG[p.img]?`<div class="fig">${IMG[p.img]()}</div>`:""}${p.steps?`<ol>${p.steps.map(x=>`<li>${md(x)}</li>`).join("")}</ol>`:""}${p.code?`<small>📄 ${esc(p.file||"")}</small><pre>${esc(p.code)}</pre><div class="row">${cpBtn(p.code)}${p.run||p.pv?`<button class="s" data-t="▶ Voir le résultat" onclick="runLesson(${i},this)">▶ Voir le résultat</button>`:""}</div>${p.run||p.pv?`<iframe class="lv ${p.mob?"mob":""}" id="lv${i}" sandbox="allow-scripts" title="Résultat"></iframe>`:""}`:""}${p.tip?`<div class="note">💡 ${md(p.tip)}</div>`:""}</div>`).join("")}
function coursTab(noBtn){const d=CUR.D.day;let h="",tipH="";
 for(const x of d.s){if(x.h=="__tip"){tipH=`<div class="note"><b>💡 Astuce &amp; erreur fréquente à éviter</b><br>${esc(x.b[0].t)}</div>`;continue}
  if(/^(Étapes|Exercice)/.test(x.h)||x.h.startsWith("Code")||x.b.some(b=>b.k=="code"))continue;h+=`<div class="card">${x.h?`<h2>${esc(x.h)}</h2>`:""}${blocks(x.b)}</div>`}
 h+=lessonHTML()+tipH;if(d.n==15)h+=`<div class="card">${partsIn()}</div>`;if(d.n==16)h+=`<div class="card">${partsIn()}</div><div class="card">${tagsIn()}</div>`;if(d.n==17)h+=`<div class="card">${tagsIn()}</div>`;if(d.n>=18&&d.n<=29)h+=refDetails();
 if(!noBtn)h+=`<p><button class="g" onclick="go('#/j/${d.n}/app')">Passer à l'application →</button></p>`;$("#body").innerHTML=h}

/* ===== Application ===== */
const locked=()=>CUR.D.ro||(CUR.rec.sub&&(CUR.rec.grade==null||CUR.rec.grade>=PM));
const pick=r=>({steps:r.steps,ex:r.ex,answer:r.answer,files:r.files||{},shot:r.shot||"",qa:r.qa||{}});
function persist(){clearTimeout(tm);if(locked())return;tm=setTimeout(flush,1500)}
function flush(){clearTimeout(tm);return locked()?Promise.resolve():sapi("fSave",{day:CUR.n,data:pick(CUR.rec)}).catch(e=>{})}
function files(){const r=CUR.rec;if(!r.files||!Object.keys(r.files).length)r.files={[DEF(CUR.n)]:""};return r.files}
const fsize=()=>Object.values(files()).reduce((t,c)=>t+c.trim().length,0);
const chk=(items,arr,pref,ord)=>items.map((t,i)=>`<label class="chk ${arr[i]?"done":""}" style="font-weight:400;margin:0"><input type="checkbox" ${arr[i]?"checked":""} onchange="tick('${pref}',${i},this.checked)"><div>${ord?`<b>${i+1}.</b> `:""}${rich(t)}</div></label>`).join("");
function tick(p,i,v){CUR.rec[p][i]=v;persist();event.target.closest(".chk").classList.toggle("done",v);prog()}
function prog(){const d=CUR.D.day,a=sec(d,/^Étapes/)[0],e=sec(d,/^Exercice/)[0],tot=(a?a.b[0].i.length:0)+(e?e.b[0].i.length:0),dn=CUR.rec.steps.filter(Boolean).length+CUR.rec.ex.filter(Boolean).length,p=$("#pg");if(p)p.innerHTML=`<div class="bar"><i style="width:${tot?dn/tot*100:0}%"></i></div><small>${dn}/${tot} actions cochées</small>`}
function appTab(){const D=CUR.D,d=D.day,r=CUR.rec,lock=locked(),code=web(d.n)||php(d.n);let h=`<div class="card"><div id="pg"></div></div>`;curFile=Object.keys(files())[0];

function quizHTML(){const Q=CUR.D.quiz;if(!Q)return"";const qa=CUR.rec.qa||{},dis=locked()?"disabled":"",sc=QR;
 return `<div class="card"><h2>🧠 Questions théoriques</h2><p class="m">Corrigées automatiquement : le correcteur n'a pas à les noter. Vous pouvez vérifier vos réponses avant de remettre.</p>${Q.map((q,i)=>{const a=qa[i];let h=`<div class="qq"><b>${i+1}. ${esc(q[1])}</b>`;
  if(q[0]=="qcm")h+=q[2].map((o,j)=>`<button class="op ${a===j?"sel":""}" ${dis} onclick="qset(${i},${j})">${esc(o)}</button>`).join("");
  else if(q[0]=="vf")h+=`<div class="row"><button class="op ${a===true?"sel":""}" ${dis} onclick="qset(${i},true)">Vrai</button><button class="op ${a===false?"sel":""}" ${dis} onclick="qset(${i},false)">Faux</button></div>`;
  else h+=`<input value="${esc(a||"")}" ${dis} placeholder="Votre réponse" oninput="qset(${i},this.value,1)">`;
  if(sc&&sc.ok[i]!=null)h+=`<div class="${sc.ok[i]?"qy":"qn"}">${sc.ok[i]?"✅ Correct":"❌ Incorrect"} — ${esc(sc.ex[i])}</div>`;return h+"</div>"}).join("")}<p><button class="s" onclick="qcheck()">✔ Vérifier mes réponses</button> ${sc?`<b>Score : ${sc.s}/${sc.t} (${sc.v}/20)</b>`:""}</p></div>`}

const fnl=(g,t)=>t==null?g:Math.round((g*(1-WT)+t*WT)*10)/10;
function fin(){const g=parseFloat($("#gr").value);if(isNaN(g))return;const t=window.GT,f=fnl(g,t);$("#fn").innerHTML=`Note finale calculée : <b>${f}/20</b> — ${f>=PM?"✅ validé":"🔁 à refaire"}`}
async function saveGrade(num,day){const g=parseFloat($("#gr").value);if(isNaN(g)||g<0||g>20)return toast("Note invalide (0 à 20)");try{const r=await aapi("fGrade",{num,day,gp:g,comment:$("#gc").value.trim()});toast(r.grade>=PM?"Validé ("+r.grade+"/20)":"À refaire ("+r.grade+"/20)");admin()}catch(e){toast(e.message)}}
render();
</script></body></html>
