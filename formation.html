 if(s.plan=="complet"&&!s.preview)h+=`<div class="note good">✅ Formation payée en totalité : accès aux ${s.mod?s.mod.len:(s.len||30)} jours.</div>`;

window.LBS=[];window.LBI=null;
const lbReg=items=>LBS.push(items)-1;
function lbOpen(sid,i){if(!LBS[sid]||!LBS[sid][i])return;LBI={sid,i};lbPaint()}
function lbPaint(){let e=$("#lb");if(!e){e=document.createElement("div");e.id="lb";e.className="lb";document.body.appendChild(e);document.body.style.overflow="hidden"}
 const L=LBS[LBI.sid],it=L[LBI.i],multi=L.length>1;
 e.innerHTML=`<div class="bar"><b>${esc(it.name||"")}${multi?` <small>(${LBI.i+1}/${L.length})</small>`:""}</b>${it.dl?`<a href="${it.dl}" download="${esc(it.name||"fichier")}" target="_blank" rel="noopener">⬇ Télécharger</a>`:""}<button onclick="lbClose()">✖ Fermer</button></div><div class="st" onclick="if(event.target===this)lbClose()">${it.k=="vid"?`<video src="${it.src}" controls autoplay playsinline onerror="vidErr(this)"></video>`:`<img src="${it.src}" alt="${esc(it.name||"")}">`}${multi?`<button class="nv p" onclick="lbGo(-1)" aria-label="Précédent">‹</button><button class="nv n" onclick="lbGo(1)" aria-label="Suivant">›</button>`:""}</div>`}
function lbGo(d){const L=LBS[LBI.sid];LBI.i=(LBI.i+d+L.length)%L.length;lbPaint()}
function lbClose(){const e=$("#lb");if(e)e.remove();document.body.style.overflow="";LBI=null}
addEventListener("keydown",e=>{if(!LBI)return;if(e.key=="Escape")lbClose();else if(e.key=="ArrowRight")lbGo(1);else if(e.key=="ArrowLeft")lbGo(-1)});
addEventListener("hashchange",()=>{if(LBI)lbClose()});
const mo=b=>b>=1048576?(b/1048576).toFixed(b>=1.05e7?0:1)+" Mo":Math.max(1,Math.round(b/1024))+" Ko";
function imgsHTML(arr,style){const sid=lbReg(arr.map((s,i)=>({k:"img",src:s,dl:s,name:"image-"+(i+1)+".jpg"})));return arr.map((s,i)=>`<img src="${s}" alt="Travail ${i+1}" ${style?`style="${style}"`:""} onclick="lbOpen(${sid},${i})">`).join("")}
/* ===== Étudiant : fichiers de travail (Word, Excel, PowerPoint, PDF…) ===== */
const MAXD=6,DMAXMB=15,DEXTS=["docx","doc","xlsx","xlsm","xls","pptx","ppt","pdf","odt","ods","odp","txt","csv","rtf","zip"];
const DICO={docx:"📝",doc:"📝",odt:"📝",rtf:"📝",txt:"📝",xlsx:"📊",xlsm:"📊",xls:"📊",ods:"📊",csv:"📊",pptx:"🎞️",ppt:"🎞️",odp:"🎞️",pdf:"📕",zip:"🗜️"};
const fileExt=n=>(String(n||"").split(".").pop()||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const docItems=(a,rm)=>a.map(v=>`<div class="doc" style="display:flex;align-items:center;gap:10px;border:1px solid var(--b);border-radius:12px;padding:9px 12px;margin:6px 0"><span style="font-size:24px">${DICO[fileExt(v.name)]||"📄"}</span><div style="flex:1;min-width:0;word-break:break-all"><b>${esc(v.name)}</b><br><small>${mo(v.size)}</small></div><a href="${v.dl||v.url}" target="_blank" rel="noopener" download="${esc(v.name)}"><button type="button" class="s" style="padding:4px 12px;min-height:34px">⬇ Ouvrir</button></a>${rm?`<button type="button" class="r" style="padding:4px 10px;min-height:34px" onclick="rmDoc('${esc(v.id)}')" aria-label="Retirer ce fichier">✖</button>`:""}</div>`).join("");
function docHTML(lock){const a=(CUR.D&&CUR.D.docs)||[];return a.length?`<p class="m" style="margin:6px 0 0"><small>${a.length}/${MAXD} fichier(s) envoyé(s)</small></p>`+docItems(a,!lock):""}
function docSlot(lock){const inf=window.FORMK=="informatique";return `<label>📎 ${inf?"Remise de mon travail pratique : mon fichier":"Mes fichiers de travail"} (Word, Excel, PowerPoint, PDF…)</label><p class="m" style="margin:2px 0 6px">${inf?"<b>Déposez ici le fichier que vous avez créé</b> (.docx, .xlsx ou .pptx), et son PDF si l'exercice le demande. ":""}Formats acceptés : Word, Excel, PowerPoint, PDF, texte, CSV, ZIP · ${MAXD} fichiers maximum · ${DMAXMB} Mo chacun. Nommez-le clairement, par exemple <i>Jour8-Lettre-NOM.docx</i>.</p><input type="file" id="docf" accept=".docx,.doc,.xlsx,.xlsm,.xls,.pptx,.ppt,.pdf,.odt,.ods,.odp,.txt,.csv,.rtf,.zip" multiple ${lock?"disabled":""} onchange="pickDoc(this)"><div id="docp" class="m"></div><div id="docv">${docHTML(lock)}</div>`}
async function pickDoc(inp){const fs=[...inp.files];inp.value="";if(!fs.length)return;if(locked())return fail("Ce travail est verrouillé.");
 const D=CUR.D;D.docs=D.docs||[];const pr=$("#docp");let ok=0;const bad=[];
 const put=(url,file,pre)=>new Promise((res,ko)=>{const x=new XMLHttpRequest();x.open("PUT",url);x.upload.onprogress=e=>{if(e.lengthComputable)pr.textContent=pre+"envoi "+Math.round(e.loaded/e.total*100)+" %"};x.onload=()=>x.status<300||x.status==409?res():ko(Object.assign(new Error(x.status==401||x.status==403?"le lien d'envoi a expiré, recommencez":"refusé par le stockage ("+x.status+")"),{fatal:1}));x.onerror=()=>ko(new Error("envoi interrompu : vérifiez votre connexion"));const fd=new FormData();fd.append("cacheControl","3600");fd.append("",file);x.send(fd)});
 for(const f of fs){if(D.docs.length>=MAXD){bad.push("maximum "+MAXD+" fichiers par jour");break}
  if(!DEXTS.includes(fileExt(f.name))){bad.push(f.name+" : format non accepté");continue}
  if(f.size>DMAXMB*1048576){bad.push(f.name+" : plus de "+DMAXMB+" Mo");continue}
  const pre=f.name+" — ";let r=null;
  try{pr.textContent=pre+"préparation…";r=await sapi("fVidInit",{day:CUR.n,name:f.name,kind:"doc",mime:f.type||"",size:f.size});
   const file=new File([f],f.name,{type:f.type||"application/octet-stream"});
   try{await put(r.url,file,pre)}catch(e){if(e.fatal)throw e;pr.textContent=pre+"connexion instable, nouvelle tentative…";await new Promise(z=>setTimeout(z,1500));await put(r.url,file,pre)}
   pr.textContent=pre+"vérification…";const d=await sapi("fVidDone",{vid:r.id});if(d.vid)D.docs.push(d.vid);ok++;$("#docv").innerHTML=docHTML(false)}
  catch(e){bad.push(f.name+" : "+e.message);if(r){try{await sapi("fVidDel",{vid:r.id})}catch(_){}}}}
 pr.textContent="";$("#docv").innerHTML=docHTML(false);toast(bad.length?(ok?ok+" envoyé(s) · ":"")+bad.join(" ; "):ok+" fichier(s) envoyé(s) ✔")}
async function rmDoc(id){if(locked())return;if(!confirm("Retirer ce fichier ?"))return;try{await sapi("fVidDel",{vid:id});CUR.D.docs=(CUR.D.docs||[]).filter(v=>v.id!==id);$("#docv").innerHTML=docHTML(false)}catch(e){toast(e.message)}}
function vidTiles(list,opt){opt=opt||{};const sid=lbReg(list.map(v=>({k:"vid",src:v.url,dl:v.dl,name:v.name})));

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
  parts.push(h.buffer,nm,e.b);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);
  cd.push(c.buffer,nm);off+=30+nm.length+sz;cds+=46+nm.length}

async function alogin(){try{const r=await api("adminLogin",{user:$("#au").value.trim(),pw:$("#pw").value,otp:($("#otp").value||"").trim()});mkAdmSave($("#au").value.trim(),$("#pw").value,r.must);if(r.must)return toast("Changez d'abord votre mot de passe provisoire sur le site principal (menu Administration).");sessionStorage.setItem("f_at",r.token);sessionStorage.setItem("f_me",JSON.stringify({name:r.name,root:r.root,perms:r.perms,must:r.must}));admin()}catch(e){toast(e.message)}}
async function act(a,d){try{await aapi(a,d);toast("Enregistré ✔");admin()}catch(e){toast(e.message)}}
function gradeRows(){return AS.subs.filter(x=>(GF.st=="all"||(GF.st=="done"?x.grade!=null:x.grade==null))&&(!GF.day||x.day==GF.day))}
function gradeCardInner(){const R=gradeRows(),days=[...new Set(AS.subs.map(x=>x.day))].sort((a,b)=>a-b),nb=AS.subs.filter(x=>x.grade==null).length;
 return `<h2>📝 Travaux (${nb} à corriger)</h2><label>Afficher</label><select onchange="GF.st=this.value;SEL.clear();repaintGrades()"><option value="pend" ${GF.st=="pend"?"selected":""}>Les travaux à noter</option><option value="done" ${GF.st=="done"?"selected":""}>Les travaux déjà notés (modifiables)</option><option value="all" ${GF.st=="all"?"selected":""}>Toutes les remises</option></select><label>Jour</label><select onchange="GF.day=+this.value;SEL.clear();repaintGrades()"><option value="0">Tous les jours</option>${days.map(d=>`<option value="${d}" ${GF.day==d?"selected":""}>Jour ${d}</option>`).join("")}</select>
 <div class="note"><b>✏️ Notation groupée</b><br><label>Note du travail (0 à 20)</label><input id="bg-n" type="number" min="0" max="20" step="0.5" inputmode="decimal"><label>Commentaire (facultatif)</label><input id="bg-c" maxlength="600"><p><button class="g" onclick="bulkGrade('sel')">Noter la sélection (${SEL.size})</button> <button class="g" onclick="bulkGrade('shown')">Noter tous les travaux affichés (${R.length})</button></p><small>Cochez les étudiants voulus, ou notez tous les travaux affichés d'un coup. La note finale de chacun tient compte de son quiz, comme pour une correction individuelle. Pour noter un étudiant seul, utilisez « Corriger ».</small></div>
 <div class="tw"><table><tr><th><input type="checkbox" ${R.length&&R.every(x=>SEL.has(x.num+"|"+x.day))?"checked":""} onchange="selAll(this.checked)"></th><th>Étudiant</th><th>Jour</th><th>Remis le</th><th>Note</th><th></th></tr>${R.map(x=>`<tr><td><input type="checkbox" ${SEL.has(x.num+"|"+x.day)?"checked":""} onchange="selOne('${esc(x.num)}',${x.day},this.checked)"></td><td>${esc(x.name)}</td><td>${x.day}</td><td>${fd(x.sub)}</td><td>${x.grade==null?'<span class="tag pend">à noter</span>':`<span class="tag ${x.grade>=PM?"ok":"bad"}">${x.grade}/20</span>`}</td><td><button class="s" onclick="gradeView('${esc(x.num)}',${x.day})">${x.grade==null?"Corriger":"✏️ Modifier la note"}</button></td></tr>`).join("")||"<tr><td colspan=6>Aucune remise à afficher.</td></tr>"}</table></div>`}
function repaintGrades(){const g=$("#gcard");if(g){const n=$("#bg-n"),c=$("#bg-c"),a=n?n.value:"",b=c?c.value:"";g.innerHTML=gradeCardInner();if($("#bg-n")){$("#bg-n").value=a;$("#bg-c").value=b}}}
function selOne(num,day,on){const k=num+"|"+day;on?SEL.add(k):SEL.delete(k);repaintGrades()}
function selAll(on){gradeRows().forEach(x=>{const k=x.num+"|"+x.day;on?SEL.add(k):SEL.delete(k)});repaintGrades()}
async function bulkGrade(mode){const g=parseFloat($("#bg-n").value);if(isNaN(g)||g<0||g>20)return toast("Note invalide (0 à 20)");const rows=mode=="sel"?AS.subs.filter(x=>SEL.has(x.num+"|"+x.day)):gradeRows();if(!rows.length)return toast("Aucun travail sélectionné");if(!confirm("Attribuer la note de "+g+"/20 à "+rows.length+" travail(aux) ?"+(rows.some(x=>x.grade!=null)?"\n\n⚠️ Certains travaux déjà notés seront re-notés.":"")))return;try{const r=await aapi("fGradeBulk",{items:rows.map(x=>({num:x.num,day:x.day})),gp:g,comment:$("#bg-c").value.trim()});toast(r.done+" travail(aux) noté(s)"+(r.skipped?" · "+r.skipped+" ignoré(s)":""));SEL.clear();admin()}catch(e){toast(e.message)}}
async function gradeView(num,day){let X;try{X=await aapi("fSub",{num,day})}catch(e){return toast(e.message)}const r=X,dt=X.data||{},F=dt.files||{};window.GT=X.gt;window.GPREV=X.grade;
 app.innerHTML=admBar("admin()")+`<div class="card"><h2>${esc(X.name)} — Jour ${X.n} : ${esc(X.title)}</h2><small>Remis le ${fd(X.sub)} · tentative n°${X.att}</small>
 <h3>Exercice demandé</h3><ul>${X.exercise.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><h3>Réponse de l'étudiant</h3><pre style="white-space:pre-wrap">${esc(dt.answer||"(vide)")}</pre>
 ${Object.entries(F).map(([k,v])=>`<h3>📄 ${esc(k)}</h3><pre>${esc(v)}</pre>`).join("")}${web(X.n)&&Object.keys(F).length?`<h3>Aperçu du site</h3><iframe sandbox="allow-scripts allow-forms allow-modals" srcdoc="${esc(site(F))}"></iframe>`:""}${shotsOf(dt).length?`<h3>Travaux partagés par l'étudiant (${shotsOf(dt).length} image${shotsOf(dt).length>1?"s":""})</h3><p class="m"><small>Touchez une image pour l'agrandir et la télécharger.</small></p><div class="shbig">${imgsHTML(shotsOf(dt))}</div>`:""}${X.vids&&X.vids.length?`<h3>🎥 Vidéos de l'étudiant (${X.vids.length})</h3><p class="m"><small>Touchez une vidéo pour la lire en grand et la télécharger.</small></p>${vidTiles(X.vids)}`:""}${X.docs&&X.docs.length?`<h3>📎 Fichiers remis par l'étudiant (${X.docs.length})</h3><p class="m"><small>Touchez « Ouvrir » pour télécharger le fichier, puis ouvrez-le dans Word, Excel ou PowerPoint pour le corriger.</small></p>${docItems(X.docs,false)}`:""}${X.vidsPurged?`<p class="m"><small>🧹 ${X.vidsPurged} vidéo(s) supprimée(s) pour libérer de l'espace.</small></p>`:""}</div>
 ${X.theory?`<div class="card"><h2>🧠 Théorie : corrigée automatiquement</h2><p><b>${X.theory.s}/${X.theory.t} bonnes réponses → ${X.theory.v}/20</b> (compte pour ${WT*100}% de la note finale)</p><ul>${X.theory.items.map(i=>`<li>${i.ok?"✅":"❌"} ${esc(i.q)}<br><small>Réponse : <i>${esc(i.a)}</i></small></li>`).join("")}</ul></div>`:""}
 <div class="card"><h2>${X.grade!=null?"✏️ Modifier la note":"Notation"}</h2>${X.grade!=null?`<div class="note"><b>Note actuelle : ${X.grade}/20</b> — ${X.grade>=PM?"✅ validé":"🔁 à refaire"}${X.gat?" · notée le "+fd(X.gat):""}<br><small>Vous pouvez modifier cette note à tout moment : le bulletin et les classements de l'étudiant sont mis à jour aussitôt.</small></div>`:""}<label>Note de l'exercice pratique /20</label><input id="gr" type="number" min="0" max="20" step="0.5" value="${X.gp??(X.theory?"":X.grade??"")}" oninput="fin()"><p id="fn" class="m">${X.theory?`Note finale = pratique × ${100-WT*100}% + théorie (${X.theory.v}/20) × ${WT*100}%. Minimum ${PM}.`:`Pas de théorie ce jour-là : la note pratique est la note finale (minimum ${PM}).`}</p>
 <label>Commentaire pour l'étudiant</label><textarea id="gc">${esc(X.comment||"")}</textarea><p><button class="g" onclick="saveGrade('${esc(num)}',${day})">${X.grade!=null?"Enregistrer la modification":"Enregistrer la note"}</button></p></div>`}
const fnl=(g,t)=>t==null?g:Math.round((g*(1-WT)+t*WT)*10)/10;
function fin(){const g=parseFloat($("#gr").value);if(isNaN(g))return;const t=window.GT,f=fnl(g,t);$("#fn").innerHTML=`Note finale calculée : <b>${f}/20</b> — ${f>=PM?"✅ validé":"🔁 à refaire"}`}
async function saveGrade(num,day){const g=parseFloat($("#gr").value);if(isNaN(g)||g<0||g>20)return toast("Note invalide (0 à 20)");const pv=window.GPREV,nf=fnl(g,window.GT);if(pv!=null&&(pv>=PM)!==(nf>=PM)&&!confirm("Cette modification fait passer le travail de « "+(pv>=PM?"validé":"à refaire")+" » ("+pv+"/20) à « "+(nf>=PM?"validé":"à refaire")+" » ("+nf+"/20).\n\n"+(nf>=PM?"L'étudiant ne pourra plus remettre ce travail et le jour suivant pourra s'ouvrir pour lui.":"L'étudiant pourra remettre ce travail à nouveau et le jour suivant restera fermé tant que ce jour n'est pas validé.")+"\n\nConfirmer la modification ?"))return;try{const r=await aapi("fGrade",{num,day,gp:g,comment:$("#gc").value.trim()});toast(r.prev!=null&&r.prev!==r.grade?"Note modifiée : "+r.prev+" → "+r.grade+"/20":r.grade>=PM?"Validé ("+r.grade+"/20)":"À refaire ("+r.grade+"/20)");admin()}catch(e){toast(e.message)}}
render();
</script></body></html>
