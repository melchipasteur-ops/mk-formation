<html lang="fr"><head><meta charset="utf-8">

<title>Ma formation — MK-DESIGN GRAPH</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1b1f2a;--m:#667;--p:#0b6fcf;--b:#dde1ea;--w:#b45309;--e:#b91c1c;--ok:#15803d;--code:#0f172a;--codet:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.55}
#app{max-width:860px;margin:0 auto;padding:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px 16px;margin:12px 0}
h1{font-size:22px;margin:4px 0}h2{font-size:18px;margin:2px 0 8px}h3{font-size:15px;margin:14px 0 6px}
small,.m{color:var(--m)}
button,.btn{font:inherit;background:var(--p);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
button.s{background:transparent;color:var(--p);border:1px solid var(--p)}button.g{background:var(--ok)}button.r{background:var(--e)}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-weight:600;margin:10px 0 4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar{height:10px;background:var(--b);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.day{border:1px solid var(--b);background:var(--c);border-radius:10px;padding:10px;cursor:pointer;text-align:left;color:var(--t);min-height:92px;display:block}
.day b{display:block;font-size:13px;color:var(--m)}.day span{font-size:14px;display:block;margin:2px 0 4px}
.day.lock{opacity:.5;cursor:not-allowed}.day.ok{border-color:var(--ok)}.day.bad{border-color:var(--e)}.day.pend{border-color:var(--w)}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;background:var(--b);color:var(--t)}
.tag.ok{background:var(--ok);color:#fff}.tag.bad{background:var(--e);color:#fff}.tag.pend{background:var(--w);color:#fff}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1;background:var(--c);color:var(--t);border:1px solid var(--b)}.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.note{border-left:4px solid var(--w);background:var(--c);padding:10px 12px;border-radius:6px;margin:10px 0}
.tool{border:1px solid var(--b);border-radius:10px;padding:10px;margin:8px 0}
pre{background:var(--code);color:var(--codet);padding:12px;border-radius:8px;overflow:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;margin:6px 0}
.pm{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border:1px dashed var(--p);border-radius:8px;padding:8px;margin:6px 0}
.pm code{flex:1;font-size:13px;white-space:pre-wrap;word-break:break-word}.pm button{padding:6px 10px;min-height:34px;font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--b)}.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.chk.done>div{text-decoration:line-through;color:var(--m)}.chk.done .pm{text-decoration:none}
iframe{width:100%;height:320px;border:1px solid var(--b);border-radius:8px;background:#fff}
.ed{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:220px;white-space:pre;tab-size:2}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 6px;border-bottom:1px solid var(--b);text-align:left}
.wf{border:1px solid var(--b);border-radius:10px;padding:6px;background:var(--bg);margin:8px 0}.z{border:2px dashed var(--p);border-radius:6px;padding:6px 8px;margin:4px;font:12px ui-monospace,Menlo,monospace;background:rgba(11,111,207,.08)}.wfm{display:flex}.zs{border-color:var(--ok);background:rgba(21,128,61,.1)}.zh,.zf{border-color:var(--w);background:rgba(180,83,9,.1)}
details summary{cursor:pointer;padding:4px 0}td code{font-size:12px;word-break:break-word}
.op{display:block;width:100%;text-align:left;background:var(--bg);color:var(--t);border:1px solid var(--b);margin:6px 0}.op.sel{border-color:var(--p);background:rgba(11,111,207,.14);font-weight:600}
.qq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--b)}.qy{color:var(--ok);margin-top:4px}.qn{color:var(--e);margin-top:4px}
.fig{margin:10px 0;text-align:center}.lv{display:none;margin-top:8px}.lv.on{display:block}.lv.mob{max-width:360px;margin-left:auto;margin-right:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:20}

a.btn{display:inline-block;text-decoration:none}</style></head><body><div id="app"></div>
<script>
/* ============ AIDE-MÉMOIRE : parties d'un site et balises HTML ============ */

["L'hébergement","L'ordinateur (serveur) qui garde les fichiers du site et les envoie aux visiteurs."],
["Les fichiers du site","index.html (la page d'accueil), style.css (le design), script.js (les interactions), un dossier images/. Le fichier index est toujours la première page."],
["Une page web","Un fichier HTML. Un site est un ensemble de pages reliées entre elles par des liens."]
];

["En-tête","\u003cheader>","Le haut de la page : logo, titre du site, parfois le menu."],
["Menu de navigation","\u003cnav>","Les liens qui permettent d'aller vers les autres pages ou sections."],
["Contenu principal","\u003cmain>","Le cœur de la page. Il n'y en a qu'un seul par page."],
["Section","\u003csection>","Un bloc sur un thème : À propos, Services, Contact…"],
["Article","\u003carticle>","Un contenu qui se comprend seul : un produit, une actualité, un témoignage."],
["Colonne latérale","\u003caside>","Les informations annexes : liens utiles, publicité, contacts."],
["Pied de page","\u003cfooter>","Le bas de la page : coordonnées, réseaux sociaux, droits d'auteur."],
["Formulaire","\u003cform>","La zone où le visiteur écrit et envoie des informations."]
];
const DOCP=[
["\u003c!DOCTYPE html>","Annonce au navigateur que la page est écrite en HTML5. Toujours en première ligne."],
["\u003chtml>","La racine : elle contient toute la page."],
["\u003chead>","La partie invisible : titre de l'onglet, encodage, lien vers le CSS."],
["\u003cbody>","La partie visible : tout ce que le visiteur voit à l'écran."]
];
const TAGS=[
["Structure du document",[
["\u003c!DOCTYPE html>","Type de document : déclare le HTML5","\u003c!DOCTYPE html>"],
["\u003chtml lang=\"fr\">","Racine de la page. lang indique la langue","\u003chtml lang=\"fr\">…\u003c/html>"],
["\u003chead>","En-tête invisible : informations sur la page","\u003chead>…\u003c/head>"],
["\u003cbody>","Corps de la page : le contenu visible","\u003cbody>…\u003c/body>"],
["\u003ctitle>","Titre affiché dans l'onglet du navigateur","\u003ctitle>Ma boutique\u003c/title>"],
["\u003cmeta>","Informations techniques (encodage, adaptation au téléphone)","\u003cmeta charset=\"UTF-8\">"],
["\u003clink>","Relie un fichier externe, surtout le CSS","\u003clink rel=\"stylesheet\" href=\"style.css\">"],
["\u003cstyle>","Contient du CSS écrit dans la page","\u003cstyle>p{color:red}\u003c/style>"],
["\u003cscript>","Contient ou charge du JavaScript","\u003cscript src=\"script.js\">\u003c/script>"],
["\u003c!-- -->","Commentaire : visible dans le code, pas à l'écran","\u003c!-- mon commentaire -->"]]],
["Organisation de la page",[
["\u003cheader>","En-tête de la page ou d'une section","\u003cheader>\u003ch1>Mon site\u003c/h1>\u003c/header>"],
["\u003cnav>","Menu de navigation","\u003cnav>\u003ca href=\"#a\">Accueil\u003c/a>\u003c/nav>"],
["\u003cmain>","Contenu principal (un seul par page)","\u003cmain>…\u003c/main>"],
["\u003csection>","Section thématique","\u003csection id=\"contact\">…\u003c/section>"],
["\u003carticle>","Contenu autonome","\u003carticle>\u003ch2>Produit\u003c/h2>\u003c/article>"],
["\u003caside>","Contenu secondaire sur le côté","\u003caside>Liens utiles\u003c/aside>"],
["\u003cfooter>","Pied de page","\u003cfooter>© 2026 Mon site\u003c/footer>"],
["\u003cdiv>","Boîte générique, sert à regrouper et à mettre en forme","\u003cdiv class=\"carte\">…\u003c/div>"],
["\u003cspan>","Petite zone générique dans une ligne de texte","\u003cspan class=\"prix\">500 F\u003c/span>"]]],
["Textes",[
["\u003ch1> à \u003ch6>","Titres : h1 le plus important (un seul), h6 le plus petit","\u003ch1>Bienvenue\u003c/h1>"],
["\u003cp>","Paragraphe","\u003cp>Mon texte.\u003c/p>"],
["\u003cbr>","Retour à la ligne (sans balise fermante)","Ligne 1\u003cbr>Ligne 2"],
["\u003chr>","Ligne horizontale de séparation","\u003chr>"],
["\u003cstrong>","Texte important (gras)","\u003cstrong>Attention\u003c/strong>"],
["\u003cem>","Texte mis en valeur (italique)","\u003cem>vraiment\u003c/em>"],
["\u003csmall>","Texte en petit","\u003csmall>Mentions\u003c/small>"],
["\u003cblockquote>","Citation","\u003cblockquote>Une citation\u003c/blockquote>"],
["\u003cpre>","Texte conservé tel quel, avec ses espaces","\u003cpre>ligne  1\u003c/pre>"],
["\u003ccode>","Morceau de code","\u003ccode>let a = 1;\u003c/code>"]]],
["Liens et médias",[
["\u003ca>","Lien cliquable (href = destination)","\u003ca href=\"https://google.com\">Google\u003c/a>"],
["\u003cimg>","Image (src = fichier, alt = description)","\u003cimg src=\"photo.jpg\" alt=\"Ma photo\">"],
["\u003cvideo>","Vidéo avec lecteur","\u003cvideo src=\"film.mp4\" controls>\u003c/video>"],
["\u003caudio>","Son avec lecteur","\u003caudio src=\"son.mp3\" controls>\u003c/audio>"],
["\u003ciframe>","Page ou vidéo intégrée dans la page","\u003ciframe src=\"https://…\">\u003c/iframe>"]]],
["Listes",[
["\u003cul>","Liste à puces","\u003cul>\u003cli>Un\u003c/li>\u003cli>Deux\u003c/li>\u003c/ul>"],

["\u003cinput>","Champ de saisie. type : text, email, password, number, checkbox, radio, submit","\u003cinput type=\"text\" id=\"nom\" name=\"nom\">"],
["\u003ctextarea>","Zone de texte sur plusieurs lignes","\u003ctextarea name=\"msg\">\u003c/textarea>"],

["\u003cbutton>","Bouton","\u003cbutton type=\"submit\">Envoyer\u003c/button>"]]],
["Attributs courants (réglages d'une balise)",[
["id","Nom unique d'un élément (utile pour le CSS et JavaScript)","\u003cp id=\"intro\">"],
["class","Nom de groupe, réutilisable sur plusieurs éléments","\u003cp class=\"rouge\">"],
["href","Adresse de destination d'un lien","\u003ca href=\"page2.html\">"],
["src","Fichier source (image, vidéo, script)","\u003cimg src=\"logo.png\">"],
["alt","Description d'une image (si elle ne s'affiche pas)","\u003cimg alt=\"Logo\">"],
["style","CSS écrit directement sur la balise","\u003cp style=\"color:red\">"],
["placeholder","Texte d'aide grisé dans un champ","\u003cinput placeholder=\"Votre nom\">"],
["required","Rend le champ obligatoire","\u003cinput required>"],
["target","Où ouvrir un lien (_blank = nouvel onglet)","\u003ca target=\"_blank\">"]]]
];

/* ============ LEÇONS DÉTAILLÉES + QUESTIONS (jours 15 à 20 : le site web, étape par étape) ============ */
/* Format des questions : ["qcm",question,[choix],indexBonneReponse,explication] · ["vf",affirmation,vrai?,explication] · ["qr",question,[réponses acceptées],explication] */
const sv=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w+80}px" role="img" font-family="system-ui,sans-serif" font-size="13">${b}</svg>`;
const R=(x,y,w,h,l,c="#0b6fcf",f=.14)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${c}" fill-opacity="${f}" stroke="${c}" stroke-width="1.5"/><text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" fill="var(--t)">${l}</text>`;
const Tx=(x,y,s,m)=>`<text x="${x}" y="${y}" fill="var(--t)" ${m?'font-family="ui-monospace,monospace" font-size="'+m+'"':""}>${s}</text>`;
const Ln=(a,b,y,c)=>`<line x1="${a}" y1="${y}" x2="${b}" y2="${y}" stroke="${c}" stroke-width="3"/>`;
const Lb=(a,b,y,l,c,dy=18)=>Ln(a,b,y,c)+`<text x="${(a+b)/2}" y="${y+dy}" text-anchor="middle" fill="${c}" font-weight="600">${l}</text>`;
const IMG={
tag:()=>sv(350,142,Tx(10,62,'&lt;a href="page.html"&gt;Cliquez ici&lt;/a&gt;',15)+Lb(37,181,42,"attribut","#b45309",-6)+Lb(10,190,72,"balise ouvrante","#0b6fcf")+Lb(190,289,92,"contenu","#15803d")+Ln(289,325,112,"#b91c1c")+`<text x="345" y="131" text-anchor="end" fill="#b91c1c" font-weight="600">balise fermante</text>`),
files:()=>sv(340,170,R(10,10,125,150,"","#667",.06)+Tx(22,30,"📁 MonSiteWeb")+R(22,42,100,28,"index.html")+R(22,76,100,28,"style.css","#15803d")+R(22,110,100,28,"images/","#b45309")+`<line x1="135" y1="85" x2="195" y2="85" stroke="var(--t)" stroke-width="2"/><polygon points="195,79 207,85 195,91" fill="var(--t)"/>`+R(210,55,120,60,"📱 Navigateur")+Tx(228,140,"affiche votre site"),),
page:()=>sv(320,236,R(10,8,300,30,"&lt;header&gt; En-tête","#b45309")+R(10,44,300,24,"&lt;nav&gt; Menu")+R(10,74,300,114,"","#667",.05)+Tx(18,90,"&lt;main&gt; Contenu principal")+R(18,98,170,36,"&lt;section&gt; Services","#15803d")+R(18,140,170,40,"&lt;section&gt; Contact","#15803d")+R(198,98,104,82,"&lt;aside&gt;","#7c3aed")+R(10,194,300,30,"&lt;footer&gt; Pied de page","#b45309")),
css:()=>sv(330,120,Tx(10,40,"h1 { color: red; }",18)+Lb(10,32,52,"sélecteur","#0b6fcf")+Lb(64,118,72,"propriété","#b45309")+Lb(140,172,92,"valeur","#15803d")+Tx(200,40,"← qui ? quoi ? comment ?")),
box:()=>sv(320,200,R(10,8,300,184,"","#b45309",.08)+Tx(18,24,"marge (margin) : l'espace dehors")+R(36,34,248,150,"","#667",.12)+Tx(44,50,"border : la bordure")+R(52,56,216,122,"","#15803d",.12)+Tx(60,72,"padding : espace dedans")+R(84,82,152,60,"contenu","#0b6fcf",.25)),
flex:()=>sv(320,230,Tx(10,20,"Sans flex : les boîtes s'empilent")+R(10,28,300,26,"Carte 1")+R(10,60,300,26,"Carte 2")+R(10,92,300,26,"Carte 3")+Tx(10,150,"Avec display: flex : côte à côte")+R(10,160,92,56,"Carte 1","#15803d")+R(114,160,92,56,"Carte 2","#15803d")+R(218,160,92,56,"Carte 3","#15803d")),
resp:()=>sv(330,175,R(10,10,190,110,"","#667",.06)+R(18,40,54,70,"1")+R(78,40,54,70,"2")+R(138,40,54,70,"3")+Tx(18,30,"💻 Ordinateur (large)")+Tx(18,142,"3 colonnes")+R(226,10,80,158,"","#667",.06)+R(234,30,64,36,"1")+R(234,72,64,36,"2")+R(234,114,64,36,"3")+Tx(222,186,"📱 Téléphone")),
};

/* ============ OUTILS ============ */
const $=s=>document.querySelector(s),app=$("#app"),CP=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=t=>t?new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function cp(i){const t=CP[i];const done=()=>toast("Copié ✔");
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,()=>fb());else fb();
 function fb(){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast("Copie impossible")}a.remove()}}
const cpBtn=t=>`<button class="s" onclick="cp(${CP.push(t)-1})">📋 Copier</button>`;
/* texte avec prompts « … » transformés en blocs copiables */
function rich(t){const ps=[];const h=esc(t.replace(/«\s*([^»]{20,}?)\s*»/g,(m,p)=>{ps.push(p);return m}));
 return h+ps.map(p=>`<div class="pm"><code>${esc(p)}</code>${cpBtn(p)}</div>`).join("")}


const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
const cdx=t=>`<code>${esc(t)}</code>`;
function partsIn(){return `<h2>🧩 Les parties d'un site web</h2>${PARTS.map(([a,b])=>`<div class="tool"><b>${esc(a)}</b><p>${esc(b)}</p></div>`).join("")}
 <h3>Les parties d'une page (de haut en bas)</h3><div class="wf"><div class="z zh">&lt;header&gt; En-tête</div><div class="z">&lt;nav&gt; Menu</div><div class="wfm"><div class="z" style="flex:3">&lt;main&gt; Contenu principal<div class="z zs">&lt;section&gt;</div><div class="z zs">&lt;article&gt;</div></div><div class="z" style="flex:1">&lt;aside&gt;</div></div><div class="z zf">&lt;footer&gt; Pied de page</div></div>
 <div class="tw" style="overflow:auto"><table><tr><th>Partie</th><th>Balise</th><th>Rôle</th></tr>${ZONES.map(z=>`<tr><td><b>${esc(z[0])}</b></td><td>${cdx(z[1])}</td><td>${esc(z[2])}</td></tr>`).join("")}</table></div>
 <h3>Les 4 parties d'un fichier HTML</h3><div style="overflow:auto"><table>${DOCP.map(z=>`<tr><td>${cdx(z[0])}</td><td>${esc(z[1])}</td></tr>`).join("")}</table></div>`}
function tagsIn(){return `<h2>🏷 Les balises HTML : nom et rôle</h2><p class="m">Une balise s'écrit entre chevrons. La plupart s'ouvrent ${cdx("<p>")} et se ferment ${cdx("</p>")}. Quelques-unes n'ont pas de fermeture : br, img, input, meta, link, hr.</p>
 ${TAGS.map(([g,rows])=>`<h3>${esc(g)}</h3><div style="overflow:auto"><table><tr><th>Balise</th><th>Nom et rôle</th><th>Exemple</th></tr>${rows.map(r=>`<tr><td>${cdx(r[0])}</td><td>${esc(r[1])}</td><td>${cdx(r[2])} <button class="s" style="padding:2px 8px;min-height:28px" onclick="cp(${CP.push(r[2])-1})">📋</button></td></tr>`).join("")}</table></div>`).join("")}`}
const refDetails=()=>`<details class="card"><summary><b>📚 Aide-mémoire : parties d'un site et balises HTML</b></summary>${partsIn()}${tagsIn()}</details>`;

function site(F){const ks=Object.keys(F),g=f=>F[f.replace(/^\.\//,"")];let m=F["index.html"]??F[ks.find(k=>/\.html?$/i.test(k))]??"";
 m=m.replace(/<link[^>]*href=["']([^"']+\.css)["'][^>]*>/gi,(x,f)=>g(f)!=null?`<style>${g(f)}</style>`:x).replace(/<script[^>]*src=["']([^"']+\.js)["'][^>]*>\s*<\/script>/gi,(x,f)=>g(f)!=null?`<script>${g(f).replace(/<\/script/gi,"<\\/script")}<\/script>`:x);return wrap(m)}

 if(!s.launched)h+=`<div class="note">⏳ <b>La formation n'a pas encore démarré.</b> Vous y aurez accès dès que MK-DESIGN GRAPH la lancera officiellement. Les <b>${s.free} premiers jours sont gratuits</b>.</div>`;

 if(s.pend)h+=`<div class="note">💳 Paiement de <b>${fmt(s.pend)}</b> en attente de validation par MK-DESIGN GRAPH.</div>`;return h}

function runLesson(i,b){const f=document.getElementById("lv"+i);if(f.classList.toggle("on")){f.srcdoc=lessonPv(i);b.textContent="✖ Masquer le résultat"}else b.textContent=b.dataset.t}

 for(const x of d.s){if(x.h=="__tip"){tipH=`<div class="note"><b>💡 Astuce &amp; erreur fréquente à éviter</b><br>${esc(x.b[0].t)}</div>`;continue}

 h+=`<p><button class="g" onclick="go('#/j/${d.n}/app')">Passer à l'application →</button></p>`;$("#body").innerHTML=h}

/* ===== Application ===== */
const locked=()=>CUR.rec.sub&&(CUR.rec.grade==null||CUR.rec.grade>=PM);
const pick=r=>({steps:r.steps,ex:r.ex,answer:r.answer,files:r.files||{},shot:r.shot||"",qa:r.qa||{}});
function persist(){clearTimeout(tm);if(locked())return;tm=setTimeout(flush,1500)}
function flush(){clearTimeout(tm);return locked()?Promise.resolve():sapi("fSave",{day:CUR.n,data:pick(CUR.rec)}).catch(e=>{})}
function files(){const r=CUR.rec;if(!r.files||!Object.keys(r.files).length)r.files={[DEF(CUR.n)]:""};return r.files}
const fsize=()=>Object.values(files()).reduce((t,c)=>t+c.trim().length,0);
const chk=(items,arr,pref,ord)=>items.map((t,i)=>`<label class="chk ${arr[i]?"done":""}" style="font-weight:400;margin:0"><input type="checkbox" ${arr[i]?"checked":""} onchange="tick('${pref}',${i},this.checked)"><div>${ord?`<b>${i+1}.</b> `:""}${rich(t)}</div></label>`).join("");
function tick(p,i,v){CUR.rec[p][i]=v;persist();event.target.closest(".chk").classList.toggle("done",v);prog()}
function prog(){const d=CUR.D.day,a=sec(d,/^Étapes/)[0],e=sec(d,/^Exercice/)[0],tot=(a?a.b[0].i.length:0)+(e?e.b[0].i.length:0),dn=CUR.rec.steps.filter(Boolean).length+CUR.rec.ex.filter(Boolean).length,p=$("#pg");if(p)p.innerHTML=`<div class="bar"><i style="width:${tot?dn/tot*100:0}%"></i></div><small>${dn}/${tot} actions cochées</small>`}
function appTab(){const D=CUR.D,d=D.day,r=CUR.rec,lock=locked(),code=web(d.n)||php(d.n);let h=`<div class="card"><div id="pg"></div></div>`;curFile=Object.keys(files())[0];
 if(d.n>=16&&d.n<=29)h+=refDetails();
 const et=sec(d,/^Étapes/)[0],ex=sec(d,/^Exercice/)[0];
 if(et)h+=`<div class="card"><h2>✅ Étapes à suivre</h2><p class="m">Cochez chaque étape une fois réalisée. Votre progression est enregistrée automatiquement.</p>${chk(et.b[0].i,r.steps,"steps",1)}</div>`;
 for(const c of d.s.filter(x=>x.b.some(b=>b.k=="code")))h+=`<div class="card"><h2>📋 ${esc(c.h||"Exemple")}</h2>`+c.b.map(b=>b.k=="code"?`<pre>${esc(b.t)}</pre><div class="row">${cpBtn(b.t)}${web(d.n)&&!lock?`<button class="s" onclick="toEditor(${CP.length-1})">⬇ Insérer dans l'éditeur</button>`:""}</div>`:`<p>${esc(b.t)}</p>`).join("")+`</div>`;
 if(ex)h+=`<div class="card"><h2>🎯 Exercice de fin de module</h2><p class="m">Réalisez ces actions, puis remettez votre travail. Il faut au moins <b>${PM}/20</b> pour débloquer le jour suivant.</p>${chk(ex.b[0].i,r.ex,"ex")}</div>`;
 h+=`<div id="qz">${quizHTML()}</div><div class="card"><h2>📤 Remise de votre travail</h2>`;
 if(r.grade!=null)h+=`<div class="note" style="border-color:${r.grade>=PM?"var(--ok)":"var(--e)"}"><b>Note finale : ${r.grade}/20</b>${r.gt!=null&&r.gp!=null?` (pratique ${r.gp}/20 · théorie ${r.gt}/20)`:""} — ${r.grade>=PM?"✅ Validé, le jour suivant est débloqué.":"🔁 Insuffisant : corrigez puis remettez à nouveau."}${r.comment?`<br>💬 ${esc(r.comment)}`:""}</div>`;
 else if(r.sub)h+=`<div class="note"><b>⏳ Remis le ${fd(r.sub)}</b> — en attente de correction.</div>`;
 if(code){const F=files(),ns=Object.keys(F);h+=`<label>Vos fichiers</label><div class="row"><select id="fsel" onchange="pickFile(this.value)">${ns.map(f=>`<option ${f==curFile?"selected":""}>${esc(f)}</option>`).join("")}</select>${lock?"":`<button class="s" onclick="newFile()">➕ Nouveau fichier</button>${ns.length>1?`<button class="r" onclick="delFile(this)">🗑 Supprimer ce fichier</button>`:""}`}</div><div id="nf"></div>
 <label>Code de <b id="fcn">${esc(curFile)}</b></label><textarea id="code" class="ed" spellcheck="false" ${lock?"disabled":""} oninput="draft()">${esc(F[curFile])}</textarea>
 ${web(d.n)?`<p><button class="s" onclick="preview()">▶ Voir l'aperçu</button></p><iframe id="pv" sandbox="allow-scripts allow-forms allow-modals" title="Aperçu"></iframe><small>Les fichiers style.css et script.js sont pris en compte s'ils sont reliés dans index.html.</small>`:`<small>L'aperçu PHP n'est pas disponible ici : testez sur votre téléphone, puis joignez une capture d'écran.</small>`}
 <div class="note" style="border-color:var(--ok)">✅ <b>Aucun hébergement nécessaire.</b> Votre code est votre remise : le correcteur voit directement votre site.</div>`}
 h+=`<label>${code?"Remarques pour le correcteur (facultatif)":"Lien de votre travail ou description"}</label><textarea id="ans" ${lock?"disabled":""} oninput="draft()" placeholder="${code?"Ce que vous avez fait, ce qui vous a bloqué…":"Collez un lien (Google Drive, YouTube « non répertorié »…) ou décrivez votre résultat"}">${esc(r.answer)}</textarea>
 <label>📷 Capture d'écran ${!code?"(possible à la place d'un lien)":php(d.n)?"(recommandée : le PHP ne s'affiche pas ici)":"(facultative)"}</label><input type="file" id="shot" accept="image/*" ${lock?"disabled":""} onchange="pickShot(this)"><div id="shotv">${r.shot?shotHTML(lock):""}</div>
 <p><button id="sb" class="g" ${lock?"disabled":""} onclick="submitDay()">${r.sub?"Remettre à nouveau":"Remettre mon travail"}</button></p><p id="err" style="color:var(--e);font-weight:600"></p></div>`;
 $("#body").innerHTML=h;prog();if(web(d.n)&&fsize())preview()}
function draft(){const c=$("#code");if(c)files()[curFile]=c.value;if($("#ans"))CUR.rec.answer=$("#ans").value;persist()}
function pickFile(f){draft();curFile=f;$("#code").value=files()[f];$("#fcn").textContent=f}
function newFile(){$("#nf").innerHTML=`<div class="row"><input id="nfn" placeholder="Nom du fichier, ex. style.css"><button onclick="addFile()">Créer</button></div>`;$("#nfn").focus()}
function addFile(){const n=$("#nfn").value.trim();if(!/^[\w\-]+\.(html|css|js|php|txt)$/i.test(n))return fail("Nom invalide. Exemples : style.css, script.js, contact.html");draft();if(n in files())return fail("Ce fichier existe déjà.");files()[n]="";curFile=n;persist();appTab()}
function delFile(b){if(!b.dataset.a){b.dataset.a=1;b.textContent="Cliquez à nouveau pour supprimer";return}const F=files(),k=Object.keys(F);if(k.length<2)return;delete F[curFile];curFile=Object.keys(F)[0];persist();appTab()}
function toEditor(i){const t=$("#code");t.value+=(t.value?"\n\n":"")+CP[i];draft();preview();toast("Inséré dans l'éditeur")}
function preview(){const f=$("#pv");if(!f)return;draft();f.srcdoc=site(files())}
const shotHTML=lock=>`<img src="${CUR.rec.shot}" alt="Capture" style="max-width:100%;max-height:220px;border:1px solid var(--b);border-radius:8px;margin-top:6px">${lock?"":`<p><button class="s" onclick="rmShot()">Retirer l'image</button></p>`}`;
function pickShot(i){const f=i.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onerror=()=>fail("Image illisible.");
 im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);CUR.rec.shot=c.toDataURL("image/jpeg",.65);$("#shotv").innerHTML=shotHTML(false);persist();toast("Capture ajoutée ✔")};im.src=u}
function rmShot(){CUR.rec.shot="";$("#shotv").innerHTML="";persist()}
function fail(m){const e=$("#err");if(e)e.textContent="⚠️ "+m;toast(m)}

/* ----- questions théoriques : corrigées par le serveur ----- */

  else if(q[0]=="vf")h+=`<div class="row"><button class="op ${a===true?"sel":""}" ${dis} onclick="qset(${i},true)">Vrai</button><button class="op ${a===false?"sel":""}" ${dis} onclick="qset(${i},false)">Faux</button></div>`;
  else h+=`<input value="${esc(a||"")}" ${dis} placeholder="Votre réponse" oninput="qset(${i},this.value,1)">`;
  if(sc&&sc.ok[i]!=null)h+=`<div class="${sc.ok[i]?"qy":"qn"}">${sc.ok[i]?"✅ Correct":"❌ Incorrect"} — ${esc(sc.ex[i])}</div>`;return h+"</div>"}).join("")}<p><button class="s" onclick="qcheck()">✔ Vérifier mes réponses</button> ${sc?`<b>Score : ${sc.s}/${sc.t} (${sc.v}/20)</b>`:""}</p></div>`}

/* ----- remise (confirmation intégrée à la page) ----- */
async function submitDay(){draft();const r=CUR.rec,d=CUR.D.day,b=$("#sb"),code=web(d.n)||php(d.n);$("#err").textContent="";
 if(code&&fsize()<20)return fail("Écrivez d'abord votre code (au moins quelques lignes) dans l'éditeur.");
 if(!code&&r.answer.trim().length<5&&!r.shot)return fail("Ajoutez un lien, une description ou une capture d'écran de votre travail.");
 if(CUR.D.quiz&&CUR.D.quiz.some((q,i)=>r.qa==null||r.qa[i]==null||r.qa[i]===""))return fail("Répondez d'abord à toutes les questions théoriques.");
 if(!armed){armed=1;const l=b.textContent;b.textContent="✔ Cliquez à nouveau pour confirmer la remise";setTimeout(()=>{armed=0;const x=$("#sb");if(x)x.textContent=l},6000);return}
 armed=0;b.disabled=true;try{await flush();await sapi("fSubmit",{day:CUR.n});toast("Travail remis ✔");dayPage(CUR.n,"app")}catch(e){b.disabled=false;fail(e.message)}}

/* ===== Espace administrateur : démarrage, jours, corrections ===== */
const arm=(b,fn,t)=>{if(!b.dataset.a){b.dataset.a=1;b.dataset.t=b.textContent;b.textContent=t;setTimeout(()=>{b.dataset.a="";b.textContent=b.dataset.t},5000);return}fn()};
async function admin(){if(!AT()){app.innerHTML=`<div class="card"><h2>🔐 Administration de la formation</h2><label>Mot de passe administrateur</label><input id="pw" type="password" onkeydown="if(event.key=='Enter')alogin()"><p><button onclick="alogin()">Entrer</button> <a href="/"><button class="s" type="button">Retour au site</button></a></p></div>`;return}
 let S;try{S=await aapi("fAdmin")}catch(e){return toast(e.message)}const c=S.cfg,td=S.subs.filter(x=>x.grade==null);
 app.innerHTML=`<div class="top"><h1>🎓 Formation — administration</h1><span><a href="/"><button class="s" type="button">Site</button></a> <button class="s" onclick="sessionStorage.removeItem('f_at');admin()">Quitter</button></span></div>
 <div class="card"><h2>🚀 Démarrage et ouverture des jours</h2>${!c.launch?`<div class="note">La formation <b>n'a pas démarré</b>. Les étudiants inscrits voient un message d'attente. Les ${2} premiers jours seront gratuits dès le lancement.</div><p><button class="g" onclick="arm(this,()=>act('fLaunch',{}),'✔ Cliquez à nouveau : lancer la formation maintenant')">🚀 Lancer officiellement la formation</button></p>`
 :`<p>Lancée le <b>${fd(c.launch)}</b> · jour prévu au calendrier : <b>${c.sched}</b> · jour ouvert aux étudiants : <b>${c.openDay} / 30</b></p><p class="m">Un nouveau jour s'ouvre automatiquement chaque jour. Si le cours du jour est terminé, vous pouvez ouvrir le suivant tout de suite.</p>
 <div class="row"><button class="g" ${c.openDay>=30?"disabled":""} onclick="act('fSetDay',{day:${c.openDay+1}})">➕ Ouvrir le jour ${Math.min(30,c.openDay+1)} maintenant</button><button class="s" onclick="act('fSetDay',{day:0})">↩ Revenir au rythme normal</button></div>
 <p><button class="r" onclick="arm(this,()=>act('fLaunch',{reset:1}),'✔ Cliquez à nouveau : tout remettre à zéro (test)')">Réinitialiser le démarrage (test)</button></p>`}</div>
 <div class="card"><h2>📝 Travaux à corriger (${td.length})</h2><div class="tw"><table><tr><th>Étudiant</th><th>Jour</th><th>Remis le</th><th>Note</th><th></th></tr>${S.subs.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.day}</td><td>${fd(x.sub)}</td><td>${x.grade==null?'<span class="tag pend">à noter</span>':`<span class="tag ${x.grade>=PM?"ok":"bad"}">${x.grade}/20</span>`}</td><td><button class="s" onclick="gradeView('${esc(x.num)}',${x.day})">Corriger</button></td></tr>`).join("")||"<tr><td colspan=5>Aucune remise.</td></tr>"}</table></div></div>
 <div class="card"><h2>👥 Étudiants</h2><div class="tw"><table><tr><th>Étudiant</th><th>Payé</th><th>Accès</th><th>Jours validés</th></tr>${S.students.map(x=>`<tr><td>${esc(x.name)}</td><td>${fmt(x.paid)}</td><td>${x.level>=30?"30 jours":"jours 1 à "+x.level}</td><td>${x.done} / 30</td></tr>`).join("")}</table></div></div>`}
async function alogin(){try{const r=await api("adminLogin",{pw:$("#pw").value});sessionStorage.setItem("f_at",r.token);admin()}catch(e){toast(e.message)}}
async function act(a,d){try{await aapi(a,d);toast("Enregistré ✔");admin()}catch(e){toast(e.message)}}
async function gradeView(num,day){let X;try{X=await aapi("fSub",{num,day})}catch(e){return toast(e.message)}const r=X,dt=X.data||{},F=dt.files||{};window.GT=X.gt;
 app.innerHTML=`<button class="s" onclick="admin()">← Retour</button><div class="card"><h2>${esc(X.name)} — Jour ${X.n} : ${esc(X.title)}</h2><small>Remis le ${fd(X.sub)} · tentative n°${X.att}</small>
 <h3>Exercice demandé</h3><ul>${X.exercise.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><h3>Réponse de l'étudiant</h3><pre style="white-space:pre-wrap">${esc(dt.answer||"(vide)")}</pre>
 ${Object.entries(F).map(([k,v])=>`<h3>📄 ${esc(k)}</h3><pre>${esc(v)}</pre>`).join("")}${web(X.n)&&Object.keys(F).length?`<h3>Aperçu du site</h3><iframe sandbox="allow-scripts allow-forms allow-modals" srcdoc="${esc(site(F))}"></iframe>`:""}${dt.shot?`<h3>Capture jointe</h3><img src="${dt.shot}" alt="Capture" style="max-width:100%;border:1px solid var(--b);border-radius:8px">`:""}</div>
 ${X.theory?`<div class="card"><h2>🧠 Théorie : corrigée automatiquement</h2><p><b>${X.theory.s}/${X.theory.t} bonnes réponses → ${X.theory.v}/20</b> (compte pour ${WT*100}% de la note finale)</p><ul>${X.theory.items.map(i=>`<li>${i.ok?"✅":"❌"} ${esc(i.q)}<br><small>Réponse : <i>${esc(i.a)}</i></small></li>`).join("")}</ul></div>`:""}
 <div class="card"><h2>Notation</h2><label>Note de l'exercice pratique /20</label><input id="gr" type="number" min="0" max="20" step="0.5" value="${X.gp??(X.theory?"":X.grade??"")}" oninput="fin()"><p id="fn" class="m">${X.theory?`Note finale = pratique × ${100-WT*100}% + théorie (${X.theory.v}/20) × ${WT*100}%. Minimum ${PM}.`:`Pas de théorie ce jour-là : la note pratique est la note finale (minimum ${PM}).`}</p>
 <label>Commentaire pour l'étudiant</label><textarea id="gc">${esc(X.comment||"")}</textarea><p><button class="g" onclick="saveGrade('${esc(num)}',${day})">Enregistrer la note</button></p></div>`}
const fnl=(g,t)=>t==null?g:Math.round((g*(1-WT)+t*WT)*10)/10;
function fin(){const g=parseFloat($("#gr").value);if(isNaN(g))return;const t=window.GT,f=fnl(g,t);$("#fn").innerHTML=`Note finale calculée : <b>${f}/20</b> — ${f>=PM?"✅ validé":"🔁 à refaire"}`}
async function saveGrade(num,day){const g=parseFloat($("#gr").value);if(isNaN(g)||g<0||g>20)return toast("Note invalide (0 à 20)");try{const r=await aapi("fGrade",{num,day,gp:g,comment:$("#gc").value.trim()});toast(r.grade>=PM?"Validé ("+r.grade+"/20)":"À refaire ("+r.grade+"/20)");admin()}catch(e){toast(e.message)}}
render();
</script></body></html>
