<style>:root{--bg:#f1f5fb;--c:#fff;--t:#0f172a;--m:#64748b;--p:#0b6fcf;--p2:#7c3aed;--b:#e2e8f0;--w:#d97706;--e:#dc2626;--ok:#16a34a;--code:#0b1220;--codet:#e2e8f0;--sh:0 8px 28px rgba(15,23,42,.08);--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--c:#131c2e;--t:#e8eefc;--m:#94a3b8;--p:#4aa3ff;--p2:#a78bfa;--b:#243049;--sh:0 8px 28px rgba(0,0,0,.35);--ok:#4ade80;--e:#f87171;--w:#fbbf24}}
*{box-sizing:border-box}html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;background:radial-gradient(1100px 480px at 8% -8%,rgba(11,111,207,.13),transparent 60%),radial-gradient(900px 420px at 100% 0,rgba(124,58,237,.11),transparent 60%),var(--bg);background-attachment:fixed}
#app{max-width:900px;margin:0 auto;padding:14px 14px 70px}
h1{font-size:23px;line-height:1.25;margin:4px 0}h2{font-size:19px;margin:2px 0 10px}h3{font-size:15px;margin:18px 0 8px;color:var(--p)}
small,.m{color:var(--m)}a{color:var(--p)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ---- cartes ---- */
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:var(--sh);animation:up .35s ease both}
.card>small:first-child{display:inline-block;background:rgba(11,111,207,.1);color:var(--p);border-radius:99px;padding:2px 12px;font-weight:700;font-size:12px;margin-bottom:6px}
.hero{border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,#0b6fcf 0%,#4f46e5 55%,#7c3aed 100%);box-shadow:0 16px 40px rgba(79,70,229,.35);position:relative;overflow:hidden;animation:up .35s ease both}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero:before{content:"";position:absolute;left:-40px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero>*{position:relative;z-index:1}.hero h1{color:#fff;font-size:24px}.hero p{color:rgba(255,255,255,.88);margin:6px 0}
.hero .logo{height:36px;background:#fff;border-radius:10px;padding:5px 10px;margin-bottom:12px;display:block}
.hero .hrow{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero button,.hero .btn{background:#fff;color:#4f46e5;box-shadow:0 6px 18px rgba(0,0,0,.18)}.hero button.s{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.45);box-shadow:none}
.ring{position:relative;width:92px;height:92px;flex:none}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}.ring small{color:rgba(255,255,255,.85)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0}
/* ---- boutons et champs ---- */
button,.btn{font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));border:0;border-radius:12px;padding:11px 16px;min-height:44px;cursor:pointer;box-shadow:0 6px 16px rgba(79,70,229,.28);transition:transform .15s,box-shadow .15s,opacity .15s}
button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(79,70,229,.34)}button:active{transform:none}
button.s{background:transparent;color:var(--p);border:1.5px solid var(--p);box-shadow:none}button.g{background:linear-gradient(135deg,#16a34a,#0d9488);box-shadow:0 6px 16px rgba(22,163,74,.3)}button.r{background:linear-gradient(135deg,#dc2626,#ea580c);box-shadow:0 6px 16px rgba(220,38,38,.28)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
input,textarea,select{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--b);border-radius:12px;background:var(--bg);color:var(--t);transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(11,111,207,.15)}
textarea{min-height:96px;resize:vertical}label{display:block;font-weight:700;margin:12px 0 5px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
/* ---- progression ---- */
.bar{height:11px;background:var(--b);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#16a34a,#22d3ee);transition:width .6s ease}
/* ---- grille des jours ---- */
.wk{display:flex;align-items:center;gap:10px;margin:22px 0 8px;font-weight:800}.wk i{width:12px;height:12px;border-radius:50%;background:var(--wk)}.wk small{font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.day{text-align:left;color:var(--t);background:var(--c);border:1px solid var(--b);border-left:6px solid var(--wk,#2563eb);border-radius:14px;padding:12px;min-height:112px;display:block;box-shadow:var(--sh);transition:transform .2s}
.day:hover{transform:translateY(-3px)}.day b{display:block;font-size:12px;color:var(--wk);letter-spacing:.4px;text-transform:uppercase}.day span{display:block;font-size:14px;line-height:1.35;margin:3px 0 7px;font-weight:600}
.day.lock{filter:grayscale(.55);opacity:.72;box-shadow:none}.day.ok{background:linear-gradient(180deg,rgba(22,163,74,.08),var(--c))}.day.bad{background:linear-gradient(180deg,rgba(220,38,38,.07),var(--c))}.day.pend{background:linear-gradient(180deg,rgba(217,119,6,.09),var(--c))}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--b);color:var(--t)}
.tag.ok{background:var(--ok);color:#fff}.tag.bad{background:var(--e);color:#fff}.tag.pend{background:var(--w);color:#fff}.tag.open{background:rgba(11,111,207,.15);color:var(--p)}
/* ---- onglets ---- */
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px;margin:10px 0;background:var(--c);border:1px solid var(--b);border-radius:16px;box-shadow:var(--sh);overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;background:transparent;color:var(--m);box-shadow:none;min-height:40px}.tabs button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 14px rgba(79,70,229,.3)}
/* ---- encadrés ---- */
.note{border-left:5px solid var(--p);background:rgba(11,111,207,.07);padding:12px 14px;border-radius:12px;margin:12px 0}
.note.warn{border-color:var(--w);background:rgba(217,119,6,.10)}.note.bad{border-color:var(--e);background:rgba(220,38,38,.09)}.note.good{border-color:var(--ok);background:rgba(22,163,74,.10)}.note.prof{border-color:var(--p2);background:rgba(124,58,237,.09)}
.tool{border:1px solid var(--b);border-radius:14px;padding:12px;margin:10px 0;background:var(--bg)}
/* ---- code et étapes ---- */
pre{background:var(--code);color:var(--codet);padding:14px;border-radius:14px;overflow:auto;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre;margin:8px 0;border:1px solid rgba(255,255,255,.07)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(124,58,237,.12);padding:1px 6px;border-radius:6px;font-size:.92em}pre code{background:none;padding:0}
.pm{display:flex;gap:8px;align-items:flex-start;background:rgba(11,111,207,.06);border:1.5px dashed var(--p);border-radius:12px;padding:10px;margin:8px 0}.pm code{flex:1;background:none;font-size:13px;white-space:pre-wrap;word-break:break-word}.pm button{padding:6px 10px;min-height:36px;font-size:13px}
ol{counter-reset:s;list-style:none;padding:0;margin:10px 0}ol>li{counter-increment:s;position:relative;padding:11px 12px 11px 50px;margin:8px 0;background:var(--bg);border-radius:12px}
ol>li:before{content:counter(s);position:absolute;left:12px;top:10px;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:800;text-align:center;line-height:28px;font-size:13px}
ul{padding-left:22px}li{margin:3px 0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;border-bottom:1px solid var(--b);cursor:pointer;border-radius:10px}.chk:hover{background:var(--bg)}.chk input{width:24px;height:24px;margin-top:2px;flex:none;accent-color:#16a34a}
.chk.done>div{text-decoration:line-through;color:var(--m)}.chk.done .pm{text-decoration:none}
.fig{margin:12px 0;text-align:center;background:var(--bg);border-radius:14px;padding:10px}
iframe{width:100%;height:330px;border:1px solid var(--b);border-radius:14px;background:#fff}.lv{display:none;margin-top:10px}.lv.on{display:block}.lv.mob{max-width:360px;margin-left:auto;margin-right:auto}
.ed{font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;min-height:230px;white-space:pre;tab-size:2}
/* ---- questions ---- */
.op{display:block;width:100%;text-align:left;background:var(--bg);color:var(--t);border:1.5px solid var(--b);margin:7px 0;box-shadow:none;font-weight:500}.op:hover{border-color:var(--p);box-shadow:none}.op.sel{border-color:var(--p);background:rgba(11,111,207,.13);font-weight:700}
.qq{margin:16px 0;padding-bottom:12px;border-bottom:1px solid var(--b)}.qy{color:var(--ok);margin-top:6px;font-weight:600}.qn{color:var(--e);margin-top:6px;font-weight:600}
/* ---- schémas de page ---- */
.wf{border:1px solid var(--b);border-radius:12px;padding:6px;background:var(--bg);margin:8px 0}.z{border:2px dashed var(--p);border-radius:8px;padding:6px 8px;margin:4px;font:12px ui-monospace,Menlo,monospace;background:rgba(11,111,207,.08)}.wfm{display:flex}.zs{border-color:var(--ok);background:rgba(22,163,74,.1)}.zh,.zf{border-color:var(--w);background:rgba(217,119,6,.1)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 7px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}th{color:var(--m);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.tw{overflow:auto}details summary{cursor:pointer;padding:6px 0;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.adm{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border-radius:14px;padding:10px 14px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.adm button{background:#fff;color:#4f46e5;min-height:36px;padding:6px 12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}.kc{border-radius:16px;padding:14px;color:#fff;box-shadow:var(--sh)}.kc b{display:block;font-size:26px;line-height:1.1}.kc small{color:rgba(255,255,255,.88)}
.k1{background:linear-gradient(135deg,#0b6fcf,#4f46e5)}.k2{background:linear-gradient(135deg,#ea580c,#d97706)}.k3{background:linear-gradient(135deg,#16a34a,#0d9488)}.k4{background:linear-gradient(135deg,#7c3aed,#db2777)}
/* ---- bulletin et fiche (papier) ---- */
.bul{background:#fff;color:#0a2a6b;border:1px solid #cbd5e1;border-radius:14px;padding:22px;margin:14px 0;box-shadow:var(--sh);color-scheme:light}
.bul .bh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid #0b6fcf;padding-bottom:12px;margin-bottom:14px}.bul img{max-width:100%;height:46px}
.bul h1{color:#0a2a6b;font-size:21px;letter-spacing:1px;margin:0}.bul table{color:#0f172a}.bul th{color:#0a2a6b;background:#eef5ff}.bul td,.bul th{padding:7px 6px;border-bottom:1px solid #e2e8f0}.bul tr:nth-child(even) td{background:#f8fafc}
.bul .sum{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}.bul .sum div{flex:1;min-width:120px;background:#eef5ff;border-radius:12px;padding:10px;text-align:center}.bul .sum b{display:block;font-size:22px;color:#0b6fcf}
.bul a{color:#0b6fcf}
.bul .seal{margin:22px 0 0 auto;width:250px;text-align:center;font-size:13px;color:#0a2a6b;break-inside:avoid;page-break-inside:avoid}.bul .seal .si{position:relative;width:215px;height:118px;margin:4px auto}.bul .seal img{position:absolute;height:auto;max-width:none}
@media print{body{background:#fff!important}#app>*:not(.bul){display:none!important}.bul{box-shadow:none;border:0;margin:0}.np{display:none!important}}
a.btn{display:inline-block;text-decoration:none}

.navbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:8;padding:8px;margin:6px 0 10px;background:color-mix(in srgb,var(--c) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--b);border-radius:16px;box-shadow:var(--sh)}.navbar button{min-height:38px;padding:7px 12px;font-size:14px}

.cd{display:flex;gap:8px;flex-wrap:wrap}.cd div{background:linear-gradient(135deg,#0a2a6b,#4f46e5);color:#fff;border-radius:14px;padding:8px 12px;text-align:center;min-width:66px;font-size:12px}.cd b{font-size:24px;display:block;line-height:1.1}
.mwb{position:relative;overflow:hidden;border-radius:10px;background:#000;margin:6px 0 14px}.mwb video,.mwb img{display:block;width:100%;max-height:70vh;object-fit:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.mwb img{pointer-events:none}.wm{position:absolute;pointer-events:none;color:rgba(255,255,255,.5);text-shadow:0 0 3px #000;font:700 13px sans-serif;top:8%;left:5%;animation:wmv 24s linear infinite}@keyframes wmv{0%{top:8%;left:5%}25%{top:8%;left:62%}50%{top:76%;left:62%}75%{top:76%;left:5%}100%{top:8%;left:5%}}
.shg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}.shi{position:relative}.shi img{width:100%;height:110px;object-fit:cover;border:1px solid var(--b);border-radius:8px;display:block}.shi button{position:absolute;top:4px;right:4px;min-height:28px;padding:2px 8px;background:#fff;color:#be123c;border-color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}.shbig img{max-width:100%;border:1px solid var(--b);border-radius:8px;margin:6px 0;display:block}

["\u003chead>","La partie invisible : titre de l'onglet, encodage, lien vers le CSS."],
["\u003cbody>","La partie visible : tout ce que le visiteur voit à l'écran."]

function login(){app.innerHTML=`<div class="hero"><img class="logo" src="${LOGO}" alt="MK-DIGIT GRAPH"><h1>🎓 Ma formation</h1><p>Création vidéo avec l'IA et sites web — 30 jours, depuis votre téléphone.</p></div><div class="card"><h2>Connexion</h2><label>Numéro d'attribution</label><input id="n" placeholder="FORM-2026-00001" value="${esc(new URLSearchParams(location.search).get("n")||"")}"><label>Code de sécurité</label><input id="i" autocapitalize="off" autocomplete="off" spellcheck="false" onkeydown="if(event.key=='Enter')doLogin()"><p><button onclick="doLogin()">Entrer</button></p><small>Ce sont les informations de votre reçu d'inscription.</small></div>`}
async function doLogin(){const n=$("#n").value.trim().toUpperCase(),i=$("#i").value.trim();try{await api("fState",{num:n,id:i});CR={num:n,id:i};sessionStorage.setItem("id_"+n,i);render()}catch(e){toast(e.message)}}

function ruleTxt(s){if(!s||s.base==null)return"Les modalités de paiement vous sont communiquées par MK-DIGIT GRAPH.";return(s.free>0?"Les "+s.free+" premiers jours sont gratuits ; ensuite ":"Paiement : ")+(s.T1>0?fmt(s.T1)+" (jours 1 à "+s.t1days+") puis "+fmt(s.base-s.T1)+", ou "+fmt(s.base)+" en une fois.":fmt(s.base)+" en une seule fois.")}
function banner(s){const pay=`<p><a href="/#/finaliser/${esc(s.num)}"><button>💳 Payer maintenant</button></a></p>`,t2=fmt((s.base||s.TOTAL)-s.T1);let h="";

 else h+=`<div class="note">📅 Jour ouvert aujourd'hui : <b>${s.openDay}</b> sur 30.${s.early&&Date.now()<s.startAt?" Accès ouvert à l'avance par MK-DIGIT GRAPH.":""} Les jours suivants s'ouvrent chaque jour, ou plus tôt sur l'ordre de MK-DIGIT GRAPH.${s.nextAt&&s.openDay<30?`<br>⏱ Prochain jour dans <b data-live-i="${s.nextAt}"></b>`:""}</div>`;
 if(s.plan=="gratuit")h+=`<div class="note warn">🎁 <b>Accès gratuit aux jours 1 à ${s.free}</b>${s.launched?` — ${s.freeLeft>0?`<b>${s.freeLeft} jour(s) gratuit(s) restant(s)</b>`:"période gratuite terminée"}`:""}.<br>Pour continuer : ${s.T1>0&&!s.offer?`<b>${fmt(s.T1)}</b> (1ʳᵉ tranche, jours 1 à ${s.t1days}) puis <b>${t2}</b>, ou `:""}<b>${fmt(s.TOTAL)}</b> en une fois (accès complet).${s.pend||AS?"":pay}</div>`;
 if(s.plan=="tranche1")h+=`<div class="note ${s.remaining>0?"warn":"bad"}">✅ 1ʳᵉ tranche payée : accès aux jours 1 à ${s.t1days}.<br>${s.remaining>0?`⏳ <b>Plus que ${s.remaining} jour(s)</b> pour régler la 2ᵉ tranche (${t2}).`:`⚠️ <b>Délai atteint</b> : réglez la 2ᵉ tranche (${t2}) pour continuer au-delà du jour ${s.t1days}.`}${s.pend||AS?"":pay}</div>`;

const dst=d=>d.sub?(d.grade==null?"pend":d.grade>=PM?"ok":"bad"):d.acc=="ok"?"open":"lock";

 app.innerHTML=h}

async function bulletin(){let B;try{B=await sapi("fBulletin")}catch(e){toast(e.message);return go("#/")}window.BUL=B;

 ${qh?`<div class="card"><h2>🧠 Questions théoriques avec les réponses</h2>${qh}</div>`:""}`;
 coursTab(true)}
async function saveNote(n){try{await aapi("fNote",{day:n,note:$("#pn").value});toast("Notes enregistrées ✔")}catch(e){toast(e.message)}}
async function giftTab(){let X;try{X=await aapi("fFreeList")}catch(e){return}
 $("#ab").innerHTML=`<div class="card"><h2>🎁 Accès offerts <small>(confidentiel)</small></h2><div class="note prof">🔒 <b>Cette liste n'est visible que par vous.</b> Un étudiant offert voit simplement « Formation payée en totalité » : ni lui, ni les autres étudiants, ni les partenaires ne savent que l'accès est gratuit. Il doit <b>valider les 30 jours</b> (14/20 minimum chacun) pour obtenir son attestation, comme tout le monde.</div>
 <label>Numéro d'attribution de l'étudiant</label><input id="gn" placeholder="Ex. FORM-2026-00012"><label>Note personnelle (facultatif, visible seulement ici)</label><input id="gt" placeholder="Ex. Bourse, partenaire, personnel…"><p><button class="g" onclick="giftSet(true)">🎁 Offrir l'accès complet</button></p></div>
 <div class="card"><h2>🎁 Offrir à plusieurs étudiants</h2><p class="m">Choisissez ceux qui peuvent suivre les cours sans payer. La note ci-dessus s'applique à tous.</p><input id="gs" placeholder="Rechercher un nom ou un numéro…" oninput="giftList()"><p class="np"><button class="s" onclick="giftUnpaid()">Sélectionner tous ceux qui n'ont rien payé</button></p><div id="gl" style="max-height:320px;overflow:auto;margin:6px 0"></div><p><button class="g" onclick="giftMany()">🎁 Offrir l'accès à la sélection (<span id="gcount">0</span>)</button></p></div>
 <div class="card"><h2>Étudiants avec accès offert (${X.list.length})</h2><div class="tw"><table><tr><th>Étudiant</th><th>Note</th><th>Depuis</th><th></th></tr>${X.list.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.num)}</small></td><td>${esc(x.note)}</td><td>${x.at?fd(x.at):""}</td><td><button class="r" onclick="arm(this,()=>giftOff('${esc(x.num)}'),'Confirmer le retrait')">Retirer</button></td></tr>`).join("")||"<tr><td colspan=4>Aucun accès offert.</td></tr>"}</table></div></div>`;giftList()}
function giftList(){const q=(($("#gs")||{}).value||"").toLowerCase().trim(),L=(window.AS?AS.students:[]).filter(x=>!x.free&&(!q||(x.name+" "+x.num).toLowerCase().includes(q)));$("#gl").innerHTML=L.map(x=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400;padding:4px 0"><input type="checkbox" style="width:auto" ${GSEL.has(x.num)?"checked":""} onchange="giftPick('${esc(x.num)}',this.checked)"> <span>${esc(x.name)} <small>${esc(x.num)} · payé ${fmt(x.paid)}</small></span></label>`).join("")||"<small>Aucun étudiant à afficher.</small>";$("#gcount").textContent=GSEL.size}
function giftPick(num,on){on?GSEL.add(num):GSEL.delete(num);$("#gcount").textContent=GSEL.size}
function giftUnpaid(){(window.AS?AS.students:[]).filter(x=>!x.free&&!x.paid).forEach(x=>GSEL.add(x.num));giftList()}
async function giftMany(){if(!GSEL.size)return toast("Sélectionnez au moins un étudiant");if(!confirm("Offrir l'accès complet à "+GSEL.size+" étudiant(s) ?"))return;try{const r=await aapi("fFreeSet",{nums:[...GSEL],on:true,note:$("#gt").value.trim()});toast(r.n+" accès offert(s) ✔");GSEL.clear();admin()}catch(e){toast(e.message)}}
async function giftSet(on){try{await aapi("fFreeSet",{num:$("#gn").value.trim(),on,note:$("#gt").value.trim()});toast("Accès offert enregistré ✔");admin()}catch(e){toast(e.message)}}
async function giftOff(num){try{await aapi("fFreeSet",{num,on:false});toast("Accès offert retiré");admin()}catch(e){toast(e.message)}}
async function alogin(){try{const r=await api("adminLogin",{user:$("#au").value.trim(),pw:$("#pw").value,otp:($("#otp").value||"").trim()});if(r.must)return toast("Changez d'abord votre mot de passe provisoire sur le site principal (menu Administration).");sessionStorage.setItem("f_at",r.token);sessionStorage.setItem("f_me",JSON.stringify({name:r.name,root:r.root,perms:r.perms,must:r.must}));admin()}catch(e){toast(e.message)}}
async function act(a,d){try{await aapi(a,d);toast("Enregistré ✔");admin()}catch(e){toast(e.message)}}
function gradeRows(){return AS.subs.filter(x=>(GF.st=="all"||x.grade==null)&&(!GF.day||x.day==GF.day))}
function gradeCardInner(){const R=gradeRows(),days=[...new Set(AS.subs.map(x=>x.day))].sort((a,b)=>a-b),nb=AS.subs.filter(x=>x.grade==null).length;
 return `<h2>📝 Travaux (${nb} à corriger)</h2><label>Afficher</label><select onchange="GF.st=this.value;SEL.clear();repaintGrades()"><option value="pend" ${GF.st=="pend"?"selected":""}>Les travaux à noter</option><option value="all" ${GF.st=="all"?"selected":""}>Toutes les remises</option></select><label>Jour</label><select onchange="GF.day=+this.value;SEL.clear();repaintGrades()"><option value="0">Tous les jours</option>${days.map(d=>`<option value="${d}" ${GF.day==d?"selected":""}>Jour ${d}</option>`).join("")}</select>
 <div class="note"><b>✏️ Notation groupée</b><br><label>Note du travail (0 à 20)</label><input id="bg-n" type="number" min="0" max="20" step="0.5" inputmode="decimal"><label>Commentaire (facultatif)</label><input id="bg-c" maxlength="600"><p><button class="g" onclick="bulkGrade('sel')">Noter la sélection (${SEL.size})</button> <button class="g" onclick="bulkGrade('shown')">Noter tous les travaux affichés (${R.length})</button></p><small>Cochez les étudiants voulus, ou notez tous les travaux affichés d'un coup. La note finale de chacun tient compte de son quiz, comme pour une correction individuelle. Pour noter un étudiant seul, utilisez « Corriger ».</small></div>
 <div class="tw"><table><tr><th><input type="checkbox" ${R.length&&R.every(x=>SEL.has(x.num+"|"+x.day))?"checked":""} onchange="selAll(this.checked)"></th><th>Étudiant</th><th>Jour</th><th>Remis le</th><th>Note</th><th></th></tr>${R.map(x=>`<tr><td><input type="checkbox" ${SEL.has(x.num+"|"+x.day)?"checked":""} onchange="selOne('${esc(x.num)}',${x.day},this.checked)"></td><td>${esc(x.name)}</td><td>${x.day}</td><td>${fd(x.sub)}</td><td>${x.grade==null?'<span class="tag pend">à noter</span>':`<span class="tag ${x.grade>=PM?"ok":"bad"}">${x.grade}/20</span>`}</td><td><button class="s" onclick="gradeView('${esc(x.num)}',${x.day})">Corriger</button></td></tr>`).join("")||"<tr><td colspan=6>Aucune remise à afficher.</td></tr>"}</table></div>`}
function repaintGrades(){const g=$("#gcard");if(g){const n=$("#bg-n"),c=$("#bg-c"),a=n?n.value:"",b=c?c.value:"";g.innerHTML=gradeCardInner();if($("#bg-n")){$("#bg-n").value=a;$("#bg-c").value=b}}}
function selOne(num,day,on){const k=num+"|"+day;on?SEL.add(k):SEL.delete(k);repaintGrades()}
function selAll(on){gradeRows().forEach(x=>{const k=x.num+"|"+x.day;on?SEL.add(k):SEL.delete(k)});repaintGrades()}
async function bulkGrade(mode){const g=parseFloat($("#bg-n").value);if(isNaN(g)||g<0||g>20)return toast("Note invalide (0 à 20)");const rows=mode=="sel"?AS.subs.filter(x=>SEL.has(x.num+"|"+x.day)):gradeRows();if(!rows.length)return toast("Aucun travail sélectionné");if(!confirm("Attribuer la note de "+g+"/20 à "+rows.length+" travail(aux) ?"+(rows.some(x=>x.grade!=null)?"\n\n⚠️ Certains travaux déjà notés seront re-notés.":"")))return;try{const r=await aapi("fGradeBulk",{items:rows.map(x=>({num:x.num,day:x.day})),gp:g,comment:$("#bg-c").value.trim()});toast(r.done+" travail(aux) noté(s)"+(r.skipped?" · "+r.skipped+" ignoré(s)":""));SEL.clear();admin()}catch(e){toast(e.message)}}
async function gradeView(num,day){let X;try{X=await aapi("fSub",{num,day})}catch(e){return toast(e.message)}const r=X,dt=X.data||{},F=dt.files||{};window.GT=X.gt;
 app.innerHTML=admBar("admin()")+`<div class="card"><h2>${esc(X.name)} — Jour ${X.n} : ${esc(X.title)}</h2><small>Remis le ${fd(X.sub)} · tentative n°${X.att}</small>
 <h3>Exercice demandé</h3><ul>${X.exercise.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><h3>Réponse de l'étudiant</h3><pre style="white-space:pre-wrap">${esc(dt.answer||"(vide)")}</pre>
 ${Object.entries(F).map(([k,v])=>`<h3>📄 ${esc(k)}</h3><pre>${esc(v)}</pre>`).join("")}${web(X.n)&&Object.keys(F).length?`<h3>Aperçu du site</h3><iframe sandbox="allow-scripts allow-forms allow-modals" srcdoc="${esc(site(F))}"></iframe>`:""}${shotsOf(dt).length?`<h3>Travaux partagés par l'étudiant (${shotsOf(dt).length} image${shotsOf(dt).length>1?"s":""})</h3><div class="shbig">${shotsOf(dt).map((s,i)=>`<img src="${s}" alt="Travail ${i+1}">`).join("")}</div>`:""}</div>
 ${X.theory?`<div class="card"><h2>🧠 Théorie : corrigée automatiquement</h2><p><b>${X.theory.s}/${X.theory.t} bonnes réponses → ${X.theory.v}/20</b> (compte pour ${WT*100}% de la note finale)</p><ul>${X.theory.items.map(i=>`<li>${i.ok?"✅":"❌"} ${esc(i.q)}<br><small>Réponse : <i>${esc(i.a)}</i></small></li>`).join("")}</ul></div>`:""}
 <div class="card"><h2>Notation</h2><label>Note de l'exercice pratique /20</label><input id="gr" type="number" min="0" max="20" step="0.5" value="${X.gp??(X.theory?"":X.grade??"")}" oninput="fin()"><p id="fn" class="m">${X.theory?`Note finale = pratique × ${100-WT*100}% + théorie (${X.theory.v}/20) × ${WT*100}%. Minimum ${PM}.`:`Pas de théorie ce jour-là : la note pratique est la note finale (minimum ${PM}).`}</p>
 <label>Commentaire pour l'étudiant</label><textarea id="gc">${esc(X.comment||"")}</textarea><p><button class="g" onclick="saveGrade('${esc(num)}',${day})">Enregistrer la note</button></p></div>`}
const fnl=(g,t)=>t==null?g:Math.round((g*(1-WT)+t*WT)*10)/10;
function fin(){const g=parseFloat($("#gr").value);if(isNaN(g))return;const t=window.GT,f=fnl(g,t);$("#fn").innerHTML=`Note finale calculée : <b>${f}/20</b> — ${f>=PM?"✅ validé":"🔁 à refaire"}`}
async function saveGrade(num,day){const g=parseFloat($("#gr").value);if(isNaN(g)||g<0||g>20)return toast("Note invalide (0 à 20)");try{const r=await aapi("fGrade",{num,day,gp:g,comment:$("#gc").value.trim()});toast(r.grade>=PM?"Validé ("+r.grade+"/20)":"À refaire ("+r.grade+"/20)");admin()}catch(e){toast(e.message)}}
render();
</script></body></html>
