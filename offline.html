<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b6fcf"><title>Hors connexion — MK-DESIGN GRAPH</title>
<style>
:root{--bg:#f1f5fb;--t:#0f172a;--m:#64748b;--p:#0b6fcf;--p2:#7c3aed}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--t:#e2e8f0;--m:#94a3b8}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
main{max-width:380px}img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 28px rgba(15,23,42,.18)}
h1{font-size:1.35rem;margin:18px 0 8px}p{color:var(--m);line-height:1.5;margin:0 0 20px}
button{font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));border:0;border-radius:14px;padding:14px 26px;min-height:48px;cursor:pointer}
</style></head><body><main>
<img src="/icons/icon-192.png" alt="MK-DESIGN GRAPH" width="96" height="96">
<h1>Vous êtes hors connexion</h1>
<p>L'application a besoin d'internet pour afficher vos cours, vos notes et vos paiements. Vérifiez votre connexion (Wi-Fi ou données mobiles), puis réessayez. Les travaux déjà enregistrés sur le serveur ne sont pas perdus.</p>
<button onclick="location.reload()">🔄 Réessayer</button>
</main></body></html>
